name: GC-8B Accessibility Performance

# Final GC-8B acceptance gate: source contracts, build delivery, and production baseline.
on:
  push:
    branches:
      - feat/gc8b-accessibility-performance
    paths:
      - "modulex-store/**"
      - ".github/workflows/gc8b-accessibility-performance.yml"
  pull_request:
    paths:
      - "modulex-store/**"
      - ".github/workflows/gc8b-accessibility-performance.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  store-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modulex-store/package-lock.json
      - run: npm ci
      - run: npm run smoke:gc8b-accessibility
      - run: npm run smoke:gc8b-performance
      - run: npm run smoke:gc8a-store-chrome-seo
      - run: npm run smoke:gallery-theme
      - run: npm run smoke:gc5-gallery-projects
      - run: npm run smoke:public-production
      - run: npm run smoke:portal-public-navbar
      - run: npm run smoke:seo-showroom
      - name: GC-8B scoped lint
        run: >-
          npx eslint
          src/app/layout.tsx
          src/app/page.tsx
          src/app/contact/page.tsx
          src/app/showroom/page.tsx
          src/components/StoreIcon.tsx
          src/components/BackToTop.tsx
          src/components/Footer.tsx
          src/components/GalleryLightbox.tsx
          src/components/ThemeToggle.tsx
          src/components/gallery/StoreProjectsGallery.tsx
          src/components/leads/LeadForm.tsx
          src/components/Home/Contact.tsx
          src/components/Home/Hero.tsx
          src/components/Home/HeroPremium.tsx
          src/components/Home/HeroSlider.tsx
          src/components/Home/Testimonials.tsx
          src/components/Home/VirtualTour.tsx
          src/lib/store/content/queries.ts
      - name: Store production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          NEXT_PUBLIC_SITE_URL: https://oakwellcabinetry.com
        run: npm run build
      - name: Verify optimized build delivery
        run: |
          if grep -R -n "bootstrap-icons" .next/static .next/server 2>/dev/null; then
            echo "Bootstrap Icons leaked into the production build"
            exit 1
          fi
          if grep -R -n "fonts.googleapis.com" .next/static .next/server 2>/dev/null; then
            echo "External Google Fonts CSS leaked into the production build"
            exit 1
          fi
          echo "GC-8B optimized build delivery: PASS"

  production-lighthouse-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture production mobile Lighthouse baseline
        working-directory: modulex-store
        run: >-
          npx --yes lighthouse https://oakwell-phi.vercel.app/
          --quiet
          --chrome-flags="--headless --no-sandbox"
          --only-categories=performance,accessibility,seo
          --output=json
          --output-path=./lighthouse-home.json
      - name: Publish baseline summary
        working-directory: modulex-store
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("lighthouse-home.json", "utf8"));
          const score = (key) => Math.round((report.categories[key]?.score ?? 0) * 100);
          const metric = (key) => report.audits[key]?.numericValue ?? null;
          const lines = [
            "## GC-8B production Lighthouse mobile baseline",
            `- Performance: ${score("performance")}`,
            `- Accessibility: ${score("accessibility")}`,
            `- SEO: ${score("seo")}`,
            `- LCP: ${metric("largest-contentful-paint")?.toFixed(0) ?? "n/a"} ms`,
            `- CLS: ${metric("cumulative-layout-shift")?.toFixed(3) ?? "n/a"}`,
            `- TBT: ${metric("total-blocking-time")?.toFixed(0) ?? "n/a"} ms`,
            "",
            "### Diagnostics",
          ];
          const diagnosticIds = [
            "first-contentful-paint",
            "speed-index",
            "server-response-time",
            "mainthread-work-breakdown",
            "bootup-time",
            "unused-javascript",
            "unused-css-rules",
            "render-blocking-resources",
            "largest-contentful-paint-element",
            "lcp-discovery-insight",
            "lcp-phases-insight",
            "render-blocking-insight",
            "third-parties-insight",
            "image-delivery-insight",
            "network-requests",
          ];
          for (const id of diagnosticIds) {
            const audit = report.audits[id];
            if (!audit) continue;
            const value = audit.displayValue || (typeof audit.numericValue === "number" ? audit.numericValue.toFixed(0) : "");
            lines.push(`- ${id}: score=${audit.score ?? "n/a"}${value ? `; ${value}` : ""}`);
          }
          const requests = report.audits["network-requests"]?.details?.items || [];
          const heavy = requests
            .filter((item) => typeof item.transferSize === "number")
            .sort((a, b) => b.transferSize - a.transferSize)
            .slice(0, 8);
          if (heavy.length) {
            lines.push("", "### Largest transfers");
            for (const item of heavy) {
              lines.push(`- ${Math.round(item.transferSize / 1024)} KiB — ${item.url}`);
            }
          }
          const summary = lines.join("\n");
          console.log(summary);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          NODE
