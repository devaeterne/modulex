# VAL-4 branch verification gate. Vercel preview status is managed by the active Admin Vercel project.
name: Admin VAL-4 Inventory Validation

on:
  push:
    paths:
      - "modulex-admin/src/components/form/Select.tsx"
      - "modulex-admin/src/components/warehouses/**"
      - "modulex-admin/src/components/stock-operations/**"
      - "modulex-admin/src/components/inventory/**"
      - "modulex-admin/src/lib/validation.ts"
      - "modulex-admin/scripts/val-4-inventory-warehouses-validation-contract.mjs"
      - "modulex-admin/package.json"
      - "modulex-admin/ADMIN_ROADMAP.md"
      - ".github/workflows/admin-val4-inventory-validation.yml"
  pull_request:
    paths:
      - "modulex-admin/src/components/form/Select.tsx"
      - "modulex-admin/src/components/warehouses/**"
      - "modulex-admin/src/components/stock-operations/**"
      - "modulex-admin/src/components/inventory/**"
      - "modulex-admin/src/lib/validation.ts"
      - "modulex-admin/scripts/val-4-inventory-warehouses-validation-contract.mjs"
      - "modulex-admin/package.json"
      - "modulex-admin/ADMIN_ROADMAP.md"
      - ".github/workflows/admin-val4-inventory-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - run: npm ci
      - name: VAL-4 inventory, warehouses and stock operations contract
        run: npm run smoke:val-4-inventory-validation
      - name: Warehouse/location regression
        run: npm run smoke:a2-warehouse-integrity
      - name: Inventory/movement regression
        run: npm run smoke:a2-inventory-movements
      - name: Stock operations regression
        run: node scripts/a2-stock-operations-scanning-contract.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
