name: Reconcile A0 roadmaps

on:
  push:
    branches:
      - phase-a0/admin-production-surface-cleanup
    paths:
      - ".github/scripts/reconcile-a0-roadmaps.mjs"
      - ".github/workflows/reconcile-a0-roadmaps.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-a0/admin-production-surface-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/reconcile-a0-roadmaps.mjs
      - run: git diff --check
      - name: Commit reconciled roadmaps
        run: |
          if git diff --quiet -- modulex-admin/ADMIN_ROADMAP.md modulex-store/STORE_ROADMAP.md; then
            echo "No roadmap changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulex-admin/ADMIN_ROADMAP.md modulex-store/STORE_ROADMAP.md
          git commit -m "docs: reconcile A0 production surface roadmaps [skip ci]"
          git push origin HEAD:phase-a0/admin-production-surface-cleanup
