name: Temporary Product List RED

on:
  push:
    branches:
      - fix/product-list-visual-actions
    paths:
      - "modulex-admin/scripts/product-list-ui-contract.mjs"
      - "modulex-admin/src/components/products/ProductsTable.tsx"
      - "modulex-admin/src/components/ui/dropdown/Dropdown.tsx"
      - ".github/workflows/tmp-product-list-red.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/product-list-ui-contract.mjs
