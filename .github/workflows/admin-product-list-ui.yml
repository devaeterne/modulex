name: Admin Product List UI

on:
  push:
    paths:
      - "modulex-admin/src/app/(admin)/products/page.tsx"
      - "modulex-admin/src/components/products/ProductsTable.tsx"
      - "modulex-admin/scripts/product-list-ui-contract.mjs"
      - "modulex-admin/AdminUICheck.md"
      - ".github/workflows/admin-product-list-ui.yml"
  pull_request:
    paths:
      - "modulex-admin/src/app/(admin)/products/page.tsx"
      - "modulex-admin/src/components/products/ProductsTable.tsx"
      - "modulex-admin/scripts/product-list-ui-contract.mjs"
      - "modulex-admin/AdminUICheck.md"
      - ".github/workflows/admin-product-list-ui.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  product-list-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - name: Install
        run: npm ci
      - name: Product List UI contract
        run: node scripts/product-list-ui-contract.mjs
      - name: Production surface regression
        run: npm run smoke:production-surface
      - name: RBAC regression
        run: npm run smoke:rbac
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
        run: npm run build
