name: Cleanup PR141

on:
  push:
    branches:
      - docs-gc4-production-acceptance

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-gc4-production-acceptance
          fetch-depth: 0
      - name: Clean temporary artifacts and align Admin roadmap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path

          path = Path("modulex-admin/ADMIN_ROADMAP.md")
          lines = path.read_text().splitlines()
          replacement = (
              "**Cross-roadmap coordination:** Store Phase 2.1A and 2.1B are complete, Phase 2.1C About is production-accepted, "
              "and Gallery/Projects remains intentionally fail-closed until approved real Gallery/Project content is published/live-accepted. "
              "Granite GC-1, GC-2, GC-3, and GC-4 are production-accepted. GC-4 production acceptance is recorded in "
              "`modulex-store/docs/granite-center/GC4_PRODUCTION_ACCEPTANCE.md`; Admin `/store/leads/form-options`, Project Consultation lead visibility, "
              "and the native lead security/attribution boundary passed production acceptance. **GC-5 — Projects / Gallery is next.** "
              "Gallery/Projects remains `[~]` and GC-5 owns curated project/media association and final Gallery acceptance. "
              "Package D configurable navigation/footer remains an A4.1 obligation under the same dynamic-content rule. "
              "Admin primary work remains Phase A1 with its current next action unchanged."
          )

          out = []
          replaced = False
          for line in lines:
              if line.startswith("**Cross-roadmap coordination:**"):
                  out.append(replacement)
                  replaced = True
              else:
                  out.append(line)

          if not replaced:
              raise SystemExit("Cross-roadmap coordination marker not found")

          path.write_text("\n".join(out) + "\n")
          PY

          rm -f .github/pr141-conflict-trigger
          git rm .github/workflows/cleanup-pr141.yml
          git add -A
          git commit -m "docs: align GC-4 closeout after conflict resolution"
          git push origin HEAD:docs-gc4-production-acceptance
