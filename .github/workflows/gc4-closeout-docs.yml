name: GC4 Closeout Docs

'on':
  push:
    branches:
      - docs-gc4-production-acceptance

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-gc4-production-acceptance
          fetch-depth: 0
      - name: Patch closeout docs
        run: python .github/gc4-closeout.py
      - name: Commit closeout docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gc4-closeout-docs.yml .github/gc4-closeout.py .gc4-closeout-trigger
          git add modulex-store/STORE_ROADMAP.md modulex-store/docs/OAKWELL_GRANITE_CENTER_MIGRATION_ROADMAP.md modulex-admin/ADMIN_ROADMAP.md modulex-store/docs/granite-center/GC4_PRODUCTION_ACCEPTANCE.md
          git commit -m "docs: close GC-4 production acceptance"
          git push origin HEAD:docs-gc4-production-acceptance
