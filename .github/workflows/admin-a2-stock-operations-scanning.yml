name: Admin A2.3 Stock Operations Scanning

on:
  push:
    paths:
      - "modulex-admin/src/app/(admin)/stock-operations/**"
      - "modulex-admin/src/app/(admin)/scan/**"
      - "modulex-admin/src/app/(admin)/qr-labels/**"
      - "modulex-admin/src/components/stock-operations/**"
      - "modulex-admin/src/components/scan/**"
      - "modulex-admin/src/components/qr-labels/**"
      - "modulex-admin/src/lib/scan/**"
      - "modulex-admin/scripts/a2-stock-operations-scanning-contract.mjs"
      - "modulex-admin/scripts/a2-inventory-movements-contract.mjs"
      - "modulex-admin/scripts/a2-warehouse-location-integrity-contract.mjs"
      - "modulex-admin/docs/acceptance/a2-3-stock-operations-scanning.md"
      - "modulex-admin/ADMIN_ROADMAP.md"
      - ".github/workflows/admin-a2-stock-operations-scanning.yml"
  pull_request:
    paths:
      - "modulex-admin/src/app/(admin)/stock-operations/**"
      - "modulex-admin/src/app/(admin)/scan/**"
      - "modulex-admin/src/app/(admin)/qr-labels/**"
      - "modulex-admin/src/components/stock-operations/**"
      - "modulex-admin/src/components/scan/**"
      - "modulex-admin/src/components/qr-labels/**"
      - "modulex-admin/src/lib/scan/**"
      - "modulex-admin/scripts/a2-stock-operations-scanning-contract.mjs"
      - "modulex-admin/scripts/a2-inventory-movements-contract.mjs"
      - "modulex-admin/scripts/a2-warehouse-location-integrity-contract.mjs"
      - "modulex-admin/docs/acceptance/a2-3-stock-operations-scanning.md"
      - "modulex-admin/ADMIN_ROADMAP.md"
      - ".github/workflows/admin-a2-stock-operations-scanning.yml"

permissions:
  contents: read

jobs:
  operations-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - run: npm ci
      - name: A2.3 stock operations and scanning contract
        run: node scripts/a2-stock-operations-scanning-contract.mjs
      - name: A2.2 inventory and movement regression
        run: npm run smoke:a2-inventory-movements
      - name: A2.1 warehouse and location regression
        run: npm run smoke:a2-warehouse-integrity
      - name: Production surface regression
        run: npm run smoke:production-surface
      - name: RBAC regression
        run: npm run smoke:rbac
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
