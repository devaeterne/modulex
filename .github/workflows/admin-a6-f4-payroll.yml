name: Admin A6 F4 Payroll Finance

on:
  push:
    paths:
      - "modulex-admin/src/components/finance/**"
      - "modulex-admin/src/components/hr/PayrollManager.tsx"
      - "modulex-admin/src/lib/finance/**"
      - "modulex-admin/scripts/a6-finance-employee-payments-contract.mjs"
      - "modulex-admin/scripts/a6-payroll-finance-reconciliation-contract.mjs"
      - "modulex-admin/scripts/a6-f4-payroll-integration-hardening-contract.mjs"
      - "modulex-admin/sql/a6-f4-payroll-integration-hardening.sql"
      - "modulex-store/supabase/migrations/20260906170000_a6_f4_payroll_integration_hardening.sql"
      - "modulex-admin/docs/acceptance/a6-f4-payroll-finance-integration.md"
      - ".github/workflows/admin-a6-f4-payroll.yml"
  pull_request:
    paths:
      - "modulex-admin/src/components/finance/**"
      - "modulex-admin/src/components/hr/PayrollManager.tsx"
      - "modulex-admin/src/lib/finance/**"
      - "modulex-admin/scripts/a6-finance-employee-payments-contract.mjs"
      - "modulex-admin/scripts/a6-payroll-finance-reconciliation-contract.mjs"
      - "modulex-admin/scripts/a6-f4-payroll-integration-hardening-contract.mjs"
      - "modulex-admin/sql/a6-f4-payroll-integration-hardening.sql"
      - "modulex-store/supabase/migrations/20260906170000_a6_f4_payroll_integration_hardening.sql"
      - "modulex-admin/docs/acceptance/a6-f4-payroll-finance-integration.md"
      - ".github/workflows/admin-a6-f4-payroll.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  f4-payroll-finance-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - run: npm ci
      - run: node scripts/a6-finance-employee-payments-contract.mjs
      - run: node scripts/a6-payroll-finance-reconciliation-contract.mjs
      - run: node scripts/a6-f4-payroll-integration-hardening-contract.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
