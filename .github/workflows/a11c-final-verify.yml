name: A1.1C final verification

on:
  push:
    branches:
      - phase-a1/customer-detail-address-integrity

permissions:
  contents: read

jobs:
  verify-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Customer directory contract
        run: npm run smoke:customer-directory
      - name: Customer master contract
        run: npm run smoke:customer-master
      - name: Customer detail integrity contract
        run: npm run smoke:customer-detail
      - name: Dealer portal Admin contract
        run: npm run smoke:dealer-portal-admin
      - name: Production surface contract
        run: npm run smoke:production-surface
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff whitespace check
        working-directory: .
        run: git diff --check origin/main...HEAD
