name: PR369 Admin Date Closeout

on:
  push:
    branches:
      - feat/us-date-format-standardization-v2
    paths:
      - ".github/workflows/pr369-admin-date-fix-runner.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/us-date-format-standardization-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply verified Admin date presentation fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              p = Path(path)
              return p, p.read_text()

          def write(path, text):
              Path(path).write_text(text)

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          def ensure_date_import(text, name):
              pattern = re.compile(r'import \{ ([^}\n]+) \} from "@/lib/dates/usDate";')
              match = pattern.search(text)
              if match:
                  names = [part.strip() for part in match.group(1).split(',')]
                  if name not in names:
                      names.append(name)
                      replacement = f'import {{ {", ".join(names)} }} from "@/lib/dates/usDate";'
                      text = text[:match.start()] + replacement + text[match.end():]
                  return text
              return once(text, '"use client";\n\n', f'"use client";\n\nimport {{ {name} }} from "@/lib/dates/usDate";\n', f'import {name}')

          fixes = []

          path = 'modulex-admin/src/components/customers/project-detail/ProjectProcurementReceiptInvoiceActions.tsx'
          p, text = read(path)
          text = ensure_date_import(text, 'formatDateOnly')
          text = once(text, 'label: `${event.deliveredDate} — ${event.effectiveQuantity} available to correct`,', 'label: `${formatDateOnly(event.deliveredDate)} — ${event.effectiveQuantity} available to correct`,', path)
          write(path, text); fixes.append(path)

          path = 'modulex-admin/src/components/finance/FinanceCustomerReceiptsManager.tsx'
          p, text = read(path)
          text = ensure_date_import(text, 'formatDateOnly')
          text = once(text, '<TableCell variant="admin">{invoice.due_date || "—"}</TableCell>', '<TableCell variant="admin">{formatDateOnly(invoice.due_date)}</TableCell>', path)
          write(path, text); fixes.append(path)

          path = 'modulex-admin/src/components/finance/FinanceExpensesManager.tsx'
          p, text = read(path)
          text = ensure_date_import(text, 'formatDateOnly')
          text = once(text, '<TableCell variant="admin">{expense.expense_date}</TableCell>', '<TableCell variant="admin">{formatDateOnly(expense.expense_date)}</TableCell>', path)
          write(path, text); fixes.append(path)

          path = 'modulex-admin/src/components/finance/FinancePaymentScheduleManager.tsx'
          p, text = read(path)
          text = ensure_date_import(text, 'formatDateOnly')
          text = once(text, '{selectedBill.due_date || "Not set"}', '{selectedBill.due_date ? formatDateOnly(selectedBill.due_date) : "Not set"}', path + ' selected bill')
          text = once(text, '<TableCell variant="admin">{row.due_date || "—"}</TableCell>', '<TableCell variant="admin">{formatDateOnly(row.due_date)}</TableCell>', path + ' due')
          text = once(text, '<TableCell variant="admin" className="font-medium">{row.scheduled_payment_date}</TableCell>', '<TableCell variant="admin" className="font-medium">{formatDateOnly(row.scheduled_payment_date)}</TableCell>', path + ' scheduled')
          write(path, text); fixes.append(path)

          path = 'modulex-admin/src/components/finance/FinanceTransactionsManager.tsx'
          p, text = read(path)
          text = ensure_date_import(text, 'formatDateOnly')
          text = once(text, 'label: `${item.period_code} · Pay ${item.pay_date} · ${money(item.remaining_amount, currencyCode)} remaining`', 'label: `${item.period_code} · Pay ${formatDateOnly(item.pay_date)} · ${money(item.remaining_amount, currencyCode)} remaining`', path)
          write(path, text); fixes.append(path)

          path = 'modulex-admin/src/components/finance/FinanceVendorBillsManager.tsx'
          p, text = read(path)
          text = ensure_date_import(text, 'formatDateOnly')
          text = once(text, '<TableCell variant="admin">{bill.invoice_date}</TableCell><TableCell variant="admin">{bill.due_date || "—"}</TableCell>', '<TableCell variant="admin">{formatDateOnly(bill.invoice_date)}</TableCell><TableCell variant="admin">{formatDateOnly(bill.due_date)}</TableCell>', path + ' list')
          text = once(text, '{String(detail.invoice.due_date ?? "—")}', '{formatDateOnly(detail.invoice.due_date)}', path + ' detail')
          write(path, text); fixes.append(path)

          path = 'modulex-admin/src/components/finance/FinanceVendorsManager.tsx'
          p, text = read(path)
          text = ensure_date_import(text, 'formatDateOnly')
          text = once(text, '<TableCell>{document.issued_on ?? "—"}</TableCell><TableCell>{document.expires_on ?? "—"}</TableCell>', '<TableCell>{formatDateOnly(document.issued_on)}</TableCell><TableCell>{formatDateOnly(document.expires_on)}</TableCell>', path)
          write(path, text); fixes.append(path)

          path = 'modulex-admin/src/components/hr/EmployeeDirectory.tsx'
          p, text = read(path)
          text = ensure_date_import(text, 'formatDateOnly')
          text = once(text, '<TableCell variant="admin">{employee.hire_date}</TableCell>', '<TableCell variant="admin">{formatDateOnly(employee.hire_date)}</TableCell>', path)
          write(path, text); fixes.append(path)

          path = 'modulex-admin/src/components/hr/PayrollManager.tsx'
          p, text = read(path)
          text = ensure_date_import(text, 'formatDateOnly')
          text = once(text, 'label: `${period.period_code} · ${period.period_start} → ${period.period_end} · Pay ${period.pay_date}`,', 'label: `${period.period_code} · ${formatDateOnly(period.period_start)} → ${formatDateOnly(period.period_end)} · Pay ${formatDateOnly(period.pay_date)}`,', path + ' options')
          text = once(text, '{selectedPeriod.period_code} · {selectedPeriod.status} · Pay date {selectedPeriod.pay_date}', '{selectedPeriod.period_code} · {selectedPeriod.status} · Pay date {formatDateOnly(selectedPeriod.pay_date)}', path + ' selected')
          write(path, text); fixes.append(path)

          path = 'modulex-admin/src/components/settings/GoogleCalendarSettings.tsx'
          p, text = read(path)
          text = ensure_date_import(text, 'formatDateTime')
          text = once(text, 'Last successful provider access: {status.connection.last_success_at}', 'Last successful provider access: {formatDateTime(status.connection.last_success_at)}', path)
          write(path, text); fixes.append(path)

          print(f'Applied {len(fixes)} verified Admin date presentation files.')
          PY
      - name: Verify date contracts
        run: |
          npm --prefix modulex-admin run smoke:us-date-format
          node scripts/us-date-format-audit.mjs --write
          node scripts/us-date-format-audit.mjs --check --scope admin
          node modulex-admin/scripts/admin-date-input-contract.mjs
      - name: Commit verified fixes
        run: |
          git config user.name "modulex-ci"
          git config user.email "modulex-ci@users.noreply.github.com"
          git add modulex-admin/src/components
          git diff --cached --check
          git commit -m "fix(dates): close remaining admin MM.DD.YYYY displays"
          git push origin HEAD:feat/us-date-format-standardization-v2
