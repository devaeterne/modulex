name: Temporary Cabinet Source Fix

on:
  push:
    branches:
      - fix/order-cabinet-source-choice

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/order-cabinet-source-choice
          fetch-depth: 0
      - name: Patch Cabinet source chooser
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('modulex-admin/src/components/customers/NewCustomerOrder.tsx')
          text = path.read_text()

          text = text.replace(
              'import Button from "@/components/ui/button/Button";\n',
              'import Button from "@/components/ui/button/Button";\nimport { Modal } from "@/components/ui/modal";\n',
              1,
          )
          text = text.replace(
              '  const [isProductPickerOpen, setIsProductPickerOpen] = useState(false);\n',
              '  const [isCabinetSourceModalOpen, setIsCabinetSourceModalOpen] = useState(false);\n  const [isProductPickerOpen, setIsProductPickerOpen] = useState(false);\n',
              1,
          )

          old_actions = '''<Button size="sm" startIcon={<PlusIcon className="size-4" />} disabled={isMutating || Boolean(preparedCustomVendorOrderId)} onClick={() => setIsProductPickerOpen(true)}>Stock Cabinet</Button><Button size="sm" variant="outline" startIcon={<PlusIcon className="size-4" />} disabled={isMutating || Boolean(preparedCustomVendorOrderId)} onClick={() => setIsVendorCabinetModalOpen(true)}>Vendor Cabinet</Button>'''
          new_actions = '''<Button size="sm" startIcon={<PlusIcon className="size-4" />} disabled={isMutating || Boolean(preparedCustomVendorOrderId)} onClick={() => setIsCabinetSourceModalOpen(true)}>Cabinet</Button>'''
          if old_actions not in text:
              raise SystemExit('Expected Stock/Vendor action pair not found')
          text = text.replace(old_actions, new_actions, 1)
          text = text.replace(
              'No lines yet. Choose Countertop, Stock Cabinet, Vendor Cabinet, or Service.',
              'No lines yet. Choose Countertop, Cabinet, or Service.',
              1,
          )

          marker = '''      {!isProposalConversion ? <OrderProductPicker isOpen={isProductPickerOpen}'''
          chooser = '''      {!isProposalConversion ? (\n        <Modal isOpen={isCabinetSourceModalOpen} onClose={() => setIsCabinetSourceModalOpen(false)} className="mx-4 w-full max-w-lg p-6" ariaLabel="Choose Cabinet Source">\n          <div className="space-y-5">\n            <div>\n              <h3 className="text-base font-medium text-gray-800 dark:text-white/90">Choose Cabinet Source</h3>\n              <FormHint>Choose whether this Cabinet line comes from stock inventory or from a vendor quote.</FormHint>\n            </div>\n            <div className="grid gap-3 sm:grid-cols-2">\n              <Button variant="outline" onClick={() => { setIsCabinetSourceModalOpen(false); setIsProductPickerOpen(true); }}>Stock Cabinet</Button>\n              <Button variant="outline" onClick={() => { setIsCabinetSourceModalOpen(false); setIsVendorCabinetModalOpen(true); }}>Vendor Cabinet</Button>\n            </div>\n            <div className="flex justify-end">\n              <Button variant="outline" onClick={() => setIsCabinetSourceModalOpen(false)}>Cancel</Button>\n            </div>\n          </div>\n        </Modal>\n      ) : null}\n'''
          if marker not in text:
              raise SystemExit('OrderProductPicker render marker not found')
          text = text.replace(marker, chooser + marker, 1)
          path.write_text(text)

          workflow = Path('.github/workflows/temp-cabinet-source-fix.yml')
          workflow.unlink()
          PY
      - name: Verify focused contract
        working-directory: modulex-admin
        run: node scripts/order-custom-vendor-cabinet-contract.mjs
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulex-admin/src/components/customers/NewCustomerOrder.tsx modulex-admin/scripts/order-custom-vendor-cabinet-contract.mjs .github/workflows/temp-cabinet-source-fix.yml
          git commit -m "fix(orders): show cabinet source chooser"
          git push origin HEAD:fix/order-cabinet-source-choice
