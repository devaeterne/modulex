name: P1.3 Temporary Live Auth Smoke

on:
  push:
    branches:
      - phase-1/dealer-login-protected-shell

permissions:
  contents: read

jobs:
  live-auth-smoke:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://bzjoeernnmvuhzyvbowc.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_if_qoUqt9Zb0cBBYew5V2w_Jt2do0V5
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Admin
        working-directory: modulex-admin
        run: npm ci
      - name: Check live-smoke credential
        id: credential
        shell: bash
        run: |
          if [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Supabase admin credential is available to the workflow."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Supabase admin credential is not configured in repository Actions secrets."
          fi
      - name: Run production-safe Dealer Auth smoke
        if: steps.credential.outputs.available == 'true'
        working-directory: modulex-admin
        run: npm run smoke:dealer-portal-auth-live
