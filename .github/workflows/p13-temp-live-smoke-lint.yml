name: P1.3 Final Temporary Verification

on:
  push:
    branches:
      - phase-1/dealer-login-protected-shell

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://bzjoeernnmvuhzyvbowc.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_if_qoUqt9Zb0cBBYew5V2w_Jt2do0V5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Store from committed lockfile
        working-directory: modulex-store
        run: npm ci

      - name: Test Store
        working-directory: modulex-store
        run: npm test

      - name: Lint P1.3 Store changes
        working-directory: modulex-store
        run: >-
          npx eslint
          src/app/layout.tsx
          src/app/dealer
          src/components/Footer.tsx
          src/components/StoreChrome.tsx
          src/lib/dealer
          src/lib/supabase/browser.ts
          src/lib/supabase/server.ts
          src/lib/supabase/proxy.ts
          src/proxy.ts
          scripts/dealer-portal-auth-contract.mjs

      - name: Build Store
        working-directory: modulex-store
        env:
          NEXT_PUBLIC_SITE_URL: https://oakwell-phi.vercel.app
        run: npm run build

      - name: Install Admin
        working-directory: modulex-admin
        run: npm ci

      - name: Test Admin P1.3 contracts
        working-directory: modulex-admin
        run: npm run smoke:dealer-portal-admin && npm run smoke:auth-recovery

      - name: Lint P1.3 Admin changes
        working-directory: modulex-admin
        run: >-
          npx eslint
          src/components/auth/ResetPasswordForm.tsx
          scripts/auth-recovery-contract.mjs
          scripts/dealer-portal-auth-live-smoke.mjs

      - name: Build Admin
        working-directory: modulex-admin
        env:
          NEXT_PUBLIC_SITE_URL: https://admin.oakwellcabinetry.com
        run: npm run build
