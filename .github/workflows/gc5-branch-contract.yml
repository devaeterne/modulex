name: GC-5 Branch Contract

on:
  push:
    branches:
      - feat/gc5-gallery-projects-media-library

permissions:
  contents: write

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate migration if missing
        shell: bash
        run: |
          set -euo pipefail
          if find modulex-store/supabase/migrations -maxdepth 1 -name '*_gc5_gallery_projects_media_library.sql' | grep -q .; then
            echo 'GC-5 migration already exists.'
            exit 0
          fi
          cd modulex-store
          npx --yes supabase@latest migration new gc5_gallery_projects_media_library
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modulex-store/supabase/migrations/*_gc5_gallery_projects_media_library.sql
          git commit -m 'chore: generate GC-5 migration'
          git push origin HEAD:feat/gc5-gallery-projects-media-library

  gc5-contracts:
    needs: generate-migration
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Store GC-5 contract
        id: store_contract
        continue-on-error: true
        run: node modulex-store/scripts/gc5-gallery-projects-contract.mjs
      - name: Admin GC-5 contract
        id: admin_contract
        continue-on-error: true
        run: node modulex-admin/scripts/gc5-gallery-projects-admin-contract.mjs
      - name: Require both contracts
        if: always()
        shell: bash
        run: |
          test "${{ steps.store_contract.outcome }}" = "success"
          test "${{ steps.admin_contract.outcome }}" = "success"
