name: GC-5 Branch Contract

on:
  push:
    branches:
      - feat/gc5-gallery-projects-media-library

permissions:
  contents: write

# Branch-scoped verification: migration preparation is idempotent, then the exact
# human-triggered HEAD runs GC-5 contracts, regressions, lint, and production builds.
jobs:
  prepare-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate migration if missing
        shell: bash
        run: |
          set -euo pipefail
          if ! find modulex-store/supabase/migrations -maxdepth 1 -name '*_gc5_gallery_projects_media_library.sql' | grep -q .; then
            cd modulex-store
            npx --yes supabase@latest migration new gc5_gallery_projects_media_library
            cd ..
          fi
      - name: Apply deterministic migration robustness fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          matches = list(Path('modulex-store/supabase/migrations').glob('*_gc5_gallery_projects_media_library.sql'))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one GC-5 migration, found {len(matches)}')
          path = matches[0]
          text = path.read_text()

          helper_marker = "create or replace function private.store_current_user_has_any_role"
          if helper_marker not in text:
              insertion = """-- Reconcile Store authorization with PR #143 without making this migration\n-- depend on production-only RBAC SQL. When user_roles exists, effective roles\n-- participate; clean replay safely falls back to the active legacy profile role.\ncreate or replace function private.store_current_user_has_any_role(allowed_roles text[])\nreturns boolean\nlanguage plpgsql\nstable\nsecurity definer\nset search_path = ''\nas $$\ndeclare\n  v_has_role boolean := false;\nbegin\n  if auth.uid() is null then\n    return false;\n  end if;\n\n  if pg_catalog.to_regclass('public.user_roles') is not null then\n    execute $sql$\n      select exists (\n        select 1\n        from public.user_roles ur\n        join public.profiles p on p.id = ur.user_id\n        where ur.user_id = $1\n          and p.is_active\n          and ur.role::text = any($2)\n      )\n    $sql$\n    into v_has_role\n    using auth.uid(), allowed_roles;\n\n    if v_has_role then\n      return true;\n    end if;\n  end if;\n\n  select exists (\n    select 1\n    from public.profiles p\n    where p.id = auth.uid()\n      and p.is_active\n      and p.role::text = any(allowed_roles)\n  )\n  into v_has_role;\n\n  return coalesce(v_has_role, false);\nend;\n$$;\n\nrevoke all on function private.store_current_user_has_any_role(text[]) from public;\nrevoke all on function private.store_current_user_has_any_role(text[]) from anon;\ngrant execute on function private.store_current_user_has_any_role(text[]) to authenticated, service_role;\n\n"""
              anchor = "alter table public.store_projects\n"
              if anchor not in text:
                  raise SystemExit('Unable to locate GC-5 migration insertion anchor')
              text = text.replace(anchor, insertion + anchor, 1)

          text = text.replace("private.current_user_has_any_role(", "private.store_current_user_has_any_role(")

          old = """  return coalesce(new, old);\nend;\n$$;\n\nrevoke all on function private.enforce_store_project_media_publishability()"""
          new = """  if tg_op = 'DELETE' then\n    return old;\n  end if;\n  return new;\nend;\n$$;\n\nrevoke all on function private.enforce_store_project_media_publishability()"""
          text = text.replace(old, new)
          old = """  if not v_referenced then\n    return coalesce(new, old);\n  end if;"""
          new = """  if not v_referenced then\n    if tg_op = 'DELETE' then\n      return old;\n    end if;\n    return new;\n  end if;"""
          text = text.replace(old, new)
          old = """  select *\n  from store_api_private.get_store_public_projects_impl()\n  where slug = p_slug\n  limit 1;"""
          new = """  select q.*\n  from store_api_private.get_store_public_projects_impl() q\n  where q.slug = p_slug\n  limit 1;"""
          text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit generated or hardened migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- modulex-store/supabase/migrations; then
            echo 'Migration already prepared.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modulex-store/supabase/migrations/*_gc5_gallery_projects_media_library.sql
          git commit -m 'fix: reconcile GC-5 Store role authorization'
          git push origin HEAD:feat/gc5-gallery-projects-media-library

  gc5-contracts:
    needs: prepare-migration
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Store GC-5 contract
        id: store_contract
        continue-on-error: true
        run: node modulex-store/scripts/gc5-gallery-projects-contract.mjs
      - name: Admin GC-5 contract
        id: admin_contract
        continue-on-error: true
        run: node modulex-admin/scripts/gc5-gallery-projects-admin-contract.mjs
      - name: Require both contracts
        if: always()
        shell: bash
        run: |
          test "${{ steps.store_contract.outcome }}" = "success"
          test "${{ steps.admin_contract.outcome }}" = "success"

  admin-verification:
    needs: prepare-migration
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - name: Install
        run: npm ci
      - name: GC-5 contract
        run: npm run smoke:gc5-gallery-projects
      - name: Secondary CMS regression
        run: npm run smoke:secondary-cms-admin
      - name: Media Library regression
        run: npm run smoke:media-library-admin
      - name: Controlled intake regression
        run: npm run smoke:gc2d-media-intake
      - name: RBAC regression
        run: npm run smoke:rbac
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  store-verification:
    needs: prepare-migration
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-store
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modulex-store/package-lock.json
      - name: Install
        run: npm ci
      - name: GC-5 contract
        run: npm run smoke:gc5-gallery-projects
      - name: Secondary CMS regression
        run: npm run smoke:secondary-cms-contract
      - name: Public content regression
        run: npm run smoke:store-public-content
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
