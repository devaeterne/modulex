name: PB-8 Tracker Patch Helper

on:
  push:
    branches:
      - feat/pb8-portal-project-projection
    paths:
      - ".github/scripts/pb8_tracker_patch.py"
      - ".github/workflows/pb8-tracker-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pb8-portal-project-projection
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python .github/scripts/pb8_tracker_patch.py
      - name: Commit tracker update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_BASE_PLAN.md modulex-store/STORE_ROADMAP.md
          git diff --cached --check
          git commit -m "docs(project): mark PB-8 in progress"
          git push
