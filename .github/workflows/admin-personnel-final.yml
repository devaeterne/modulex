name: Admin Personnel Final Domain

on:
  push:
    branches:
      - feat/personnel-final-domain-closeout
  pull_request:
    paths:
      - 'modulex-admin/src/app/(admin)/personnel/**'
      - 'modulex-admin/src/app/(admin)/finance/payroll/**'
      - 'modulex-admin/src/components/hr/**'
      - 'modulex-admin/src/lib/auth/permissions.ts'
      - 'modulex-admin/docs/PERSONNEL_DOMAIN_CONTRACT.md'
      - 'modulex-admin/scripts/personnel-final-contract.mjs'
      - 'modulex-store/supabase/migrations/*personnel_final_domain_closeout.sql'
      - '.github/workflows/admin-personnel-final.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Personnel final-domain deterministic contract
        run: node modulex-admin/scripts/personnel-final-contract.mjs
