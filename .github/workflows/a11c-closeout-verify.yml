name: A1.1C roadmap closeout verify

on:
  push:
    branches:
      - docs/admin-a1-1c-production-acceptance

permissions:
  contents: read

jobs:
  verify-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify closeout diff
        run: |
          git diff --name-only origin/main...HEAD | grep -v '^.github/workflows/a11c-closeout-verify.yml$' > /tmp/a11c-files
          test "$(cat /tmp/a11c-files)" = "modulex-admin/ADMIN_ROADMAP.md"
          grep -Fq 'Current Admin next action: **A1.2A — review global and customer-scoped order list consistency**' modulex-admin/ADMIN_ROADMAP.md
          grep -Fq '20260829165525_customer_address_integrity' modulex-admin/ADMIN_ROADMAP.md
          git diff --check origin/main...HEAD
