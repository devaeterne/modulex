name: Admin Dashboard Shell UI

on:
  push:
    paths:
      - "modulex-admin/src/app/(admin)/layout.tsx"
      - "modulex-admin/src/components/dashboard/**"
      - "modulex-admin/src/components/header/**"
      - "modulex-admin/src/layout/AppHeader.tsx"
      - "modulex-admin/src/layout/AppSidebar.tsx"
      - "modulex-admin/scripts/dashboard-shell-ui-contract.mjs"
      - "modulex-admin/scripts/admin-production-surface-contract.mjs"
      - ".github/workflows/admin-dashboard-shell-ui.yml"
  pull_request:
    paths:
      - "modulex-admin/src/app/(admin)/layout.tsx"
      - "modulex-admin/src/components/dashboard/**"
      - "modulex-admin/src/components/header/**"
      - "modulex-admin/src/layout/AppHeader.tsx"
      - "modulex-admin/src/layout/AppSidebar.tsx"
      - "modulex-admin/scripts/dashboard-shell-ui-contract.mjs"
      - "modulex-admin/scripts/admin-production-surface-contract.mjs"
      - ".github/workflows/admin-dashboard-shell-ui.yml"

permissions:
  contents: read

jobs:
  admin-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - name: Install
        run: npm ci
      - name: Dashboard shell UI contract
        run: node scripts/dashboard-shell-ui-contract.mjs
      - name: Production surface regression
        run: npm run smoke:production-surface
      - name: RBAC regression
        run: npm run smoke:rbac
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
        run: npm run build
