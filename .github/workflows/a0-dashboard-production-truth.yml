name: A0 Dashboard production truth

on:
  push:
    branches:
      - phase-a0/admin-dashboard-production-truth
    paths:
      - modulex-admin/**
      - .github/workflows/a0-dashboard-production-truth.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    env:
      A0_DASHBOARD_STATUS: complete
      FULL_RUN_ID: "33253394213"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified dashboard closeout
        working-directory: modulex-admin
        run: python scripts/tmp-a0-dashboard-roadmap.py
      - name: Remove temporary verification files
        run: |
          rm .github/workflows/a0-dashboard-production-truth.yml
          rm modulex-admin/scripts/tmp-a0-dashboard-roadmap.py
      - name: Verify closeout diff
        run: |
          git diff --check
          git status --short
      - name: Commit closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close A0 dashboard production-truth audit [skip ci]"
          git push
