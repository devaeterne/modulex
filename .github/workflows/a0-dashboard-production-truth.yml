name: A0 Dashboard production truth

on:
  push:
    branches:
      - phase-a0/admin-dashboard-production-truth
    paths:
      - modulex-admin/**
      - .github/workflows/a0-dashboard-production-truth.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - run: npm ci
      - run: npm run smoke:production-surface
