name: Admin A6 F5B AR Aging

on:
  push:
    paths:
      - "modulex-admin/scripts/a6-finance-ar-aging-contract.mjs"
      - "modulex-admin/sql/a6-finance-ar-aging.sql"
      - "modulex-admin/src/app/(admin)/finance/ar-aging/**"
      - "modulex-admin/src/components/finance/FinanceArAgingManager.tsx"
      - "modulex-admin/src/lib/finance/arAging.ts"
      - "modulex-admin/src/layout/AppSidebar.tsx"
      - "modulex-admin/src/components/finance/FinanceOverview.tsx"
      - "modulex-store/supabase/migrations/*_a6_finance_ar_aging.sql"
      - ".github/workflows/admin-a6-f5b-ar-aging.yml"
  pull_request:
    paths:
      - "modulex-admin/scripts/a6-finance-ar-aging-contract.mjs"
      - "modulex-admin/sql/a6-finance-ar-aging.sql"
      - "modulex-admin/src/app/(admin)/finance/ar-aging/**"
      - "modulex-admin/src/components/finance/FinanceArAgingManager.tsx"
      - "modulex-admin/src/lib/finance/arAging.ts"
      - "modulex-admin/src/layout/AppSidebar.tsx"
      - "modulex-admin/src/components/finance/FinanceOverview.tsx"
      - "modulex-store/supabase/migrations/*_a6_finance_ar_aging.sql"
      - ".github/workflows/admin-a6-f5b-ar-aging.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ar-reporting-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - run: npm ci
      - run: npm run smoke:a6-finance-core
      - run: node scripts/a6-finance-customer-receipts-contract.mjs
      - run: node scripts/a6-finance-ap-aging-contract.mjs
      - run: node scripts/a6-finance-ar-aging-contract.mjs
      - run: npm run typecheck
