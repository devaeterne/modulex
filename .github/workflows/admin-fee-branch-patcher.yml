name: Administrative Fee Branch Patcher

on:
  push:
    branches:
      - feat/orders-administrative-fee
    paths:
      - ".github/workflows/admin-fee-branch-patcher.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orders-administrative-fee
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded Administrative Fee source patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              text = p.read_text()
              new = fn(text)
              if new == text:
                  raise SystemExit(f"{path}: no change")
              p.write_text(new)

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 exact match, found {count}")
              return text.replace(old, new, 1)

          def rx(text, pattern, repl, label, flags=0):
              new, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 regex match, found {count}")
              return new

          # New Order
          def patch_new(text):
              text = once(text, "  createCustomerOrder,\n", "", "new remove legacy create import")
              text = once(text, 'import { createProjectCustomerOrder } from "@/lib/customers/project-domain";\n', '', "new remove project create import")
              text = once(text, '} from "@/lib/customers/order-domain";\n', '} from "@/lib/customers/order-domain";\nimport { createCustomerOrderWithAdministrativeFee, loadAdministrativeFeeDefault } from "@/lib/customers/order-administrative-fee-domain";\n', "new add fee domain import")
              text = once(text, "  paymentCommissionPercent: string;\n", "  administrativeFeePercent: string;\n", "new validated header")
              text = once(text, "  paymentCommissionPercent?: string;\n", "  administrativeFeePercent?: string;\n", "new field error")
              text = once(text, '  const [paymentCommissionPercent, setPaymentCommissionPercent] = useState("0");\n', '  const [administrativeFeeDefaultPercent, setAdministrativeFeeDefaultPercent] = useState("3.000");\n  const [administrativeFeePercent, setAdministrativeFeePercent] = useState("3.000");\n', "new fee state")
              text = once(text, '        const [context, profileResult] = await Promise.all([loadCreateOrderContext(customerId), getCurrentProfile()]);\n', '        const [context, profileResult, administrativeFeeDefault] = await Promise.all([loadCreateOrderContext(customerId), getCurrentProfile(), loadAdministrativeFeeDefault()]);\n', "new load default")
              text = once(text, '        setPaymentCommissionPercent(String(defaultMethod?.commission_percent ?? 0));\n', '        setAdministrativeFeeDefaultPercent(administrativeFeeDefault.toFixed(3));\n        setAdministrativeFeePercent(administrativeFeeDefault.toFixed(3));\n', "new set default")
              text = rx(text, r'  const selectedPaymentMethod = useMemo\([^\n]+\);\n', '', "new remove selected payment")
              text = rx(text, r'  const defaultCommissionValue = String\(selectedPaymentMethod\?\.commission_percent \?\? 0\);\n  const defaultCommissionPercent = Number\(defaultCommissionValue\);\n  const appliedCommissionPercent = Number\(paymentCommissionPercent \|\| 0\);\n  const commissionOverridden = Number\.isFinite\(appliedCommissionPercent\) && Math\.abs\(appliedCommissionPercent - defaultCommissionPercent\) > 0\.0001;\n', '', "new remove commission derived")
              text = rx(text, r'  const preview = useMemo\(\(\) => \{.*?\n  \}, \[items, priceMap, orderDiscount, taxRate, paymentCommissionPercent\]\);', '''  const preview = useMemo(() => {
    let subtotal = 0;
    for (const item of items) {
      const quantity = Number(item.quantity || 0);
      const discount = Number(item.discount_percent || 0);
      const price = item.pricing_model === "manual_service" ? Number(item.unit_price ?? 0) : priceMap.get(item.product_id) ?? 0;
      subtotal += quantity * price * (1 - discount / 100);
    }
    const orderDiscountNumber = Math.max(0, Number(orderDiscount || 0));
    const baseSell = Math.max(0, subtotal - orderDiscountNumber);
    const administrativeFee = Math.round(baseSell * Math.min(100, Math.max(0, Number(administrativeFeePercent || 0))) / 100 * 100) / 100;
    const customerVisibleSell = baseSell + administrativeFee;
    const tax = customerVisibleSell * Math.max(0, Number(taxRate || 0)) / 100;
    return { subtotal, baseSell, administrativeFee, customerVisibleSell, tax, grandTotal: customerVisibleSell + tax };
  }, [items, priceMap, orderDiscount, taxRate, administrativeFeePercent]);''', "new preview", re.S)
              text = once(text, '      errors.paymentCommissionPercent ? "new-order-payment-commission" : null,\n', '      errors.administrativeFeePercent ? "new-order-administrative-fee" : null,\n', "new focus fee")
              text = rx(text, r'  function handlePaymentMethodChange\(methodId: string\) \{.*?\n  \}', '''  function handlePaymentMethodChange(methodId: string) {
    clearHeaderError("paymentMethodId");
    setPaymentMethodId(methodId);
  }''', "new payment handler", re.S)
              text = once(text, '    const commission = parseOrderPercent(paymentCommissionPercent);\n', '    const administrativeFee = parseOrderPercent(administrativeFeePercent);\n', "new validate fee parse")
              text = once(text, '    if (commission.error || commission.value === null) errors.paymentCommissionPercent = commission.error ?? "Enter a valid payment commission.";\n', '    if (administrativeFee.error || administrativeFee.value === null) errors.administrativeFeePercent = administrativeFee.error ?? "Enter a valid Administrative Fee.";\n', "new validate fee error")
              text = once(text, '    setFieldErrors((current) => ({ ...current, priceGroupId: undefined, paymentMethodId: undefined, paymentCommissionPercent: undefined, shippingAddressId: undefined, orderDiscount: undefined, taxRate: undefined }));\n', '    setFieldErrors((current) => ({ ...current, priceGroupId: undefined, paymentMethodId: undefined, administrativeFeePercent: undefined, shippingAddressId: undefined, orderDiscount: undefined, taxRate: undefined }));\n', "new clear fee error")
              text = once(text, '      paymentCommissionPercent: commission.value!,\n', '      administrativeFeePercent: administrativeFee.value!,\n', "new header fee value")
              text = once(text, '      paymentCommissionPercent: header.paymentCommissionPercent,\n', '      administrativeFeePercent: header.administrativeFeePercent,\n', "new mutation fee")
              text = once(text, '    if (projectId) return createProjectCustomerOrder({ projectId, ...sharedInput });\n    return createCustomerOrder({ customerId: customer.id, ...sharedInput });\n', '    return createCustomerOrderWithAdministrativeFee({ customerId: customer.id, projectId, ...sharedInput });\n', "new mutation helper")
              text = once(text, '  const commissionHint = `Default: ${defaultCommissionPercent.toFixed(2)}%${commissionOverridden ? ` · Override: ${Number(paymentCommissionPercent || 0).toFixed(2)}%` : ""}`;\n', '  const administrativeFeeHint = `Company default: ${Number(administrativeFeeDefaultPercent).toFixed(3)}% · Internal revenue adjustment; customer documents absorb it into line prices.`;\n', "new fee hint")
              text = once(text, 'options={paymentMethods.map((method) => ({ value: method.id, label: `${method.name}${Number(method.commission_percent) > 0 ? ` (+${Number(method.commission_percent).toFixed(2)}%)` : ""}` }))}', 'options={paymentMethods.map((method) => ({ value: method.id, label: method.name }))}', "new payment options")
              text = rx(text, r'          <Field label="Applied Commission \(%\)".*?</Field>\n', '          <Field label="Administrative Fee (%)" htmlFor="new-order-administrative-fee" hint={administrativeFeeHint}><div className="flex gap-2"><div className="min-w-0 flex-1"><Input id="new-order-administrative-fee" type="number" min="0" max="100" step="0.001" value={administrativeFeePercent} error={Boolean(fieldErrors.administrativeFeePercent)} hint={fieldErrors.administrativeFeePercent} onChange={(event) => { clearHeaderError("administrativeFeePercent"); setAdministrativeFeePercent(event.target.value); }} /></div><Button size="sm" variant="outline" onClick={() => { clearHeaderError("administrativeFeePercent"); setAdministrativeFeePercent(administrativeFeeDefaultPercent); }}>Use Company Default</Button></div></Field>\n', "new fee field")
              text = rx(text, r'        <div className="xl:col-span-4"><ComponentCard title="Order Total".*?</ComponentCard></div>\n', '        <div className="xl:col-span-4"><ComponentCard title="Order Total" desc="Internal preview; customer-facing documents absorb Administrative Fee into line prices."><div className="space-y-3"><SummaryRow label="Lines after discount" value={money(preview.subtotal, currency)} /><SummaryRow label="Order discount" value={`-${money(Number(orderDiscount || 0), currency)}`} /><SummaryRow label="Base Sell" value={money(preview.baseSell, currency)} /><SummaryRow label={`Administrative Fee (${Number(administrativeFeePercent || 0).toFixed(3)}%)`} value={money(preview.administrativeFee, currency)} /><SummaryRow label="Customer-visible Sell" value={money(preview.customerVisibleSell, currency)} /><SummaryRow label="Tax" value={money(preview.tax, currency)} /><SummaryRow label="Customer Total" value={money(preview.grandTotal, currency)} strong divider /><Button className="w-full" disabled={isMutating || isLoadingPrices || !paymentMethodId} onClick={saveOrder}>{isSaving ? "Creating…" : initialStatus === "confirmed" ? "Create & Confirm" : "Create Draft"}</Button></div></ComponentCard></div>\n', "new total card")
              return text
          edit("modulex-admin/src/components/customers/NewCustomerOrder.tsx", patch_new)

          # Edit Order
          def patch_edit(text):
              text = once(text, "  updateCustomerOrder,\n", "", "edit remove legacy update import")
              text = once(text, '} from "@/lib/customers/order-domain";\n', '} from "@/lib/customers/order-domain";\nimport { updateCustomerOrderWithAdministrativeFee } from "@/lib/customers/order-administrative-fee-domain";\n', "edit add fee domain import")
              text = once(text, "  appliedCommission?: string;\n", "  administrativeFeePercent?: string;\n", "edit field error")
              text = once(text, '  const [appliedCommission, setAppliedCommission] = useState("0");\n', '  const [administrativeFeePercent, setAdministrativeFeePercent] = useState("0");\n', "edit fee state")
              text = once(text, '        setAppliedCommission(String(loadedOrder.payment_commission_percent ?? 0));\n', '        setAdministrativeFeePercent(String(loadedOrder.administrative_fee_percent ?? 0));\n', "edit load fee")
              text = rx(text, r'  const preview = useMemo\(\(\) => \{.*?\n  \}, \[items, productMap, priceValueMap, orderDiscount, taxRate, appliedCommission\]\);', '''  const preview = useMemo(() => {
    let subtotal = 0;
    for (const item of items) {
      const qty = Math.max(0, Number(item.quantity || 0));
      const price = Math.max(0, Number(resolveOrderLineUnitPriceValue(item, productMap.get(item.product_id), priceValueMap) ?? 0));
      const discount = Math.min(100, Math.max(0, Number(item.discount_percent || 0)));
      subtotal += qty * price * (1 - discount / 100);
    }
    const discountAmount = Math.max(0, Number(orderDiscount || 0));
    const baseSell = Math.max(0, subtotal - discountAmount);
    const administrativeFee = Math.round(baseSell * Math.min(100, Math.max(0, Number(administrativeFeePercent || 0))) / 100 * 100) / 100;
    const customerVisibleSell = baseSell + administrativeFee;
    const tax = customerVisibleSell * Math.max(0, Number(taxRate || 0)) / 100;
    return { subtotal, baseSell, administrativeFee, customerVisibleSell, tax, grandTotal: customerVisibleSell + tax };
  }, [items, productMap, priceValueMap, orderDiscount, taxRate, administrativeFeePercent]);''', "edit preview", re.S)
              text = once(text, '      errors.appliedCommission ? "edit-order-payment-commission" : null,\n', '      errors.administrativeFeePercent ? "edit-order-administrative-fee" : null,\n', "edit focus fee")
              text = once(text, '  function validateRevision(): { items: ValidatedRevisionItem[]; taxRate: string; orderDiscount: string; commission: string } | null {\n', '  function validateRevision(): { items: ValidatedRevisionItem[]; taxRate: string; orderDiscount: string; administrativeFeePercent: string } | null {\n', "edit validation type")
              text = once(text, '    const commission = parseOrderPercent(appliedCommission);\n', '    const administrativeFee = parseOrderPercent(administrativeFeePercent);\n', "edit fee parse")
              text = once(text, '    if (commission.error || commission.value === null) errors.appliedCommission = commission.error ?? "Enter a valid payment commission.";\n', '    if (administrativeFee.error || administrativeFee.value === null) errors.administrativeFeePercent = administrativeFee.error ?? "Enter a valid Administrative Fee.";\n', "edit fee error")
              text = once(text, '    return { items: validatedItems, taxRate: tax.value!, orderDiscount: discount.value!, commission: commission.value! };\n', '    return { items: validatedItems, taxRate: tax.value!, orderDiscount: discount.value!, administrativeFeePercent: administrativeFee.value! };\n', "edit return fee")
              text = once(text, '      const revision = await updateCustomerOrder({\n', '      const revision = await updateCustomerOrderWithAdministrativeFee({\n', "edit mutation helper")
              text = once(text, '        paymentCommissionPercent: validated.commission,\n', '        paymentCommissionPercent: order.payment_commission_percent ?? 0,\n        administrativeFeePercent: validated.administrativeFeePercent,\n', "edit mutation values")
              text = rx(text, r'  const defaultCommissionValue = String\(selectedPaymentMethod\?\.commission_percent \?\? 0\);\n  const defaultCommission = Number\(defaultCommissionValue\);\n  const commissionOverridden = Math\.abs\(Number\(appliedCommission \|\| 0\) - defaultCommission\) > 0\.0001;\n', '', "edit remove commission derived")
              text = once(text, 'onChange={(id) => { clearHeaderError("paymentMethodId"); clearHeaderError("appliedCommission"); setPaymentMethodId(id); const method = paymentMethods.find((item) => item.id === id); setAppliedCommission(String(method?.commission_percent ?? 0)); }}', 'onChange={(id) => { clearHeaderError("paymentMethodId"); setPaymentMethodId(id); }}', "edit payment handler")
              text = rx(text, r'          <Field label="Applied Commission \(%\)".*?</Field>\n', '          <Field label="Administrative Fee (%)" htmlFor="edit-order-administrative-fee" hint="Order snapshot. Changing it follows the existing revision/approval rules."><Input id="edit-order-administrative-fee" type="number" min="0" max="100" step="0.001" inputMode="decimal" value={administrativeFeePercent} error={Boolean(fieldErrors.administrativeFeePercent)} hint={fieldErrors.administrativeFeePercent} onChange={(event) => { clearHeaderError("administrativeFeePercent"); setAdministrativeFeePercent(event.target.value); }} /></Field>\n', "edit fee field")
              text = rx(text, r'        <div className="xl:col-span-4"><ComponentCard title="Revised Total".*?</ComponentCard></div>\n', '        <div className="xl:col-span-4"><ComponentCard title="Revised Total" desc="Internal preview; the server remains authoritative when the revision is saved."><div className="space-y-3"><SummaryRow label="Lines after discount" value={money(preview.subtotal, currency)} /><SummaryRow label="Order discount" value={`-${money(Number(orderDiscount || 0), currency)}`} /><SummaryRow label="Base Sell" value={money(preview.baseSell, currency)} /><SummaryRow label={`Administrative Fee (${Number(administrativeFeePercent || 0).toFixed(3)}%)`} value={money(preview.administrativeFee, currency)} /><SummaryRow label="Customer-visible Sell" value={money(preview.customerVisibleSell, currency)} /><SummaryRow label="Tax" value={money(preview.tax, currency)} /><SummaryRow label="Customer Total" value={money(preview.grandTotal, currency)} strong divider /><Button className="w-full" disabled={isSaving || isLoadingPrices || !revisionPolicy.canEdit} onClick={saveRevision}>{isSaving ? "Saving…" : revisionPolicy.mode === "approval" ? "Submit for Approval" : "Save Revision"}</Button></div></ComponentCard></div>\n', "edit total card")
              return text
          edit("modulex-admin/src/components/customers/EditCustomerOrder.tsx", patch_edit)

          # Customer-facing Order print: fetch canonical visible line projection and remove commercial fee wording.
          def patch_order_print(text):
              text = once(text, '  const [items, setItems] = useState<CustomerOrderItem[]>([]);\n', '  const [items, setItems] = useState<CustomerOrderItem[]>([]);\n  const [visiblePricing, setVisiblePricing] = useState(new Map<string, { unitPrice: number; lineTotal: number }>());\n', "print visible state")
              text = once(text, '      setItems(itemRows);\n', '''      setItems(itemRows);
      const visibleResult = await supabase.rpc("get_customer_order_visible_line_pricing", { p_order_id: params.orderId });
      if (!visibleResult.error) {
        setVisiblePricing(new Map(((visibleResult.data ?? []) as Array<{ order_item_id: string; customer_visible_unit_price: number | string; customer_visible_line_total: number | string }>).map((row) => [row.order_item_id, { unitPrice: Number(row.customer_visible_unit_price), lineTotal: Number(row.customer_visible_line_total) }])));
      }
''', "print visible load")
              text = rx(text, r'      \.\.\.\(Number\(order\.payment_commission_percent \?\? 0\) > 0 \? \[\{ label: "Payment Commission", value: `\$\{Number\(order\.payment_commission_percent\)\.toFixed\(2\)\}%` \}\] : \[\]\),\n', '', "print remove commission info")
              text = once(text, '      unitPrice: formatMoney(item.unit_price),\n', '      unitPrice: formatMoney(visiblePricing.get(item.id)?.unitPrice ?? item.unit_price),\n', "print visible unit")
              text = once(text, '      total: formatMoney(item.line_total),\n', '      total: formatMoney(visiblePricing.get(item.id)?.lineTotal ?? item.line_total),\n', "print visible total")
              text = once(text, '      { label: "Subtotal", value: formatMoney(order.subtotal) },\n      { label: "Order Discount", value: `-${formatMoney(order.discount_amount)}` },\n', '      { label: "Subtotal", value: formatMoney(Number(order.customer_visible_sell_amount ?? 0) + Number(order.discount_amount ?? 0)) },\n      { label: "Discount", value: `-${formatMoney(order.discount_amount)}` },\n', "print visible subtotal")
              text = rx(text, r'      \.\.\.\(Number\(order\.payment_commission_amount \?\? 0\) > 0 \? \[\{ label: `\$\{order\.payment_method_name_snapshot \|\| "Payment"\} Commission`, value: formatMoney\(order\.payment_commission_amount\) \}\] : \[\]\),\n', '      ...(Number(order.payment_commission_amount ?? 0) > 0 ? [{ label: "Order adjustment", value: formatMoney(order.payment_commission_amount) }] : []),\n', "print neutral legacy adjustment")
              return text
          edit("modulex-admin/src/components/customers/CustomerOrderPrint.tsx", patch_order_print)

          # Invoice customer-facing surfaces: future fee is already inside invoice lines; legacy immutable surcharge gets neutral wording.
          def patch_invoice_detail(text):
              return rx(text, r'\{Number\(invoice\.payment_commission_amount\) > 0 \? <SummaryRow label=\{`Payment commission \(\$\{Number\(invoice\.payment_commission_percent\)\.toFixed\(2\)\}%\)`\} value=\{formatMoney\(invoice\.payment_commission_amount\)\} /> : null\}', '{Number(invoice.payment_commission_amount) > 0 ? <SummaryRow label="Order adjustment" value={formatMoney(invoice.payment_commission_amount)} /> : null}', "invoice detail neutral adjustment")
          edit("modulex-admin/src/components/customers/CustomerInvoiceDetail.tsx", patch_invoice_detail)

          def patch_invoice_print(text):
              return rx(text, r'      \.\.\.\(Number\(invoice\.payment_commission_amount \?\? 0\) > 0 \? \[\{ label: `Payment Commission \(\$\{Number\(invoice\.payment_commission_percent\)\.toFixed\(2\)\}%\)`, value: formatMoney\(invoice\.payment_commission_amount\) \}\] : \[\]\),', '      ...(Number(invoice.payment_commission_amount ?? 0) > 0 ? [{ label: "Order adjustment", value: formatMoney(invoice.payment_commission_amount) }] : []),', "invoice print neutral adjustment")
          edit("modulex-admin/src/components/customers/CustomerInvoicePrint.tsx", patch_invoice_print)

          # Contract follows the focused Settings card + mutation adapter and combined migrations.
          def patch_contract(text):
              text = once(text, 'const migration = read("modulex-store/supabase/migrations/20260908150000_customer_order_administrative_fee.sql");\n', 'const migration = [\n  read("modulex-store/supabase/migrations/20260908150000_customer_order_administrative_fee.sql"),\n  read("modulex-store/supabase/migrations/20260908150500_customer_order_administrative_fee_defaults.sql"),\n  read("modulex-store/supabase/migrations/20260908151000_customer_order_visible_pricing_rpc.sql"),\n].join("\\n");\n', "contract migrations")
              text = once(text, 'const settingsUi = read("modulex-admin/src/components/settings/GeneralSettingsManager.tsx");\n', 'const settingsUi = read("modulex-admin/src/components/settings/AdministrativeFeeSettings.tsx");\n', "contract settings surface")
              text = once(text, 'const orderDomain = read("modulex-admin/src/lib/customers/order-domain.ts");\n', 'const orderDomain = read("modulex-admin/src/lib/customers/order-administrative-fee-domain.ts");\n', "contract fee domain")
              text = once(text, 'assert.match(migration, /administrative_fee_percent[^;]*default\\s+0(?:\\.0+)?/i, "Existing Orders must migrate with a 0% Administrative Fee snapshot");\n', 'assert.match(migration, /update\\s+public\\.customer_orders[\\s\\S]*administrative_fee_percent\\s*=\\s*0\\.000/i, "Existing Orders must be explicitly backfilled with a 0% Administrative Fee snapshot");\nassert.match(migration, /set_customer_order_defaults[\\s\\S]*administrative_fee_default_percent/i, "Future Orders that omit a fee must snapshot the current General Settings default");\n', "contract historical/default boundary")
              text = once(text, 'assert.match(migration, /remainder|remaining_cents|allocated_cents/i, "Visible-line allocation must explicitly handle deterministic cent remainder");\n', 'assert.match(migration, /base_allocated_cents|fee_allocated_cents/i, "Visible-line allocation must explicitly handle deterministic cent remainder");\n', "contract cent allocation")
              text = once(text, '  assert.doesNotMatch(source, /Administrative Fee|Admin Fee|Applied Commission/i, `${name} must not expose Administrative Fee terminology to customers`);\n', '  assert.doesNotMatch(source, /Administrative Fee|Admin Fee|Applied Commission|Payment Commission/i, `${name} must not expose fee/commission terminology to customers`);\n', "contract customer terminology")
              return text
          edit("modulex-admin/scripts/order-administrative-fee-contract.mjs", patch_contract)

          PY
      - name: Verify focused contract before commit
        run: |
          cd modulex-admin
          node scripts/order-administrative-fee-contract.mjs
          node scripts/order-list-consistency-contract.mjs
      - name: Commit guarded patches
        run: |
          git config user.name "modulex-ci"
          git config user.email "modulex-ci@users.noreply.github.com"
          git add modulex-admin
          git diff --cached --check
          git commit -m "feat(orders): wire Administrative Fee through Admin surfaces"
          git push origin HEAD:feat/orders-administrative-fee
