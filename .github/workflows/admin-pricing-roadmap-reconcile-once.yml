name: Admin Pricing Roadmap Reconcile Once

on:
  push:
    paths:
      - ".github/workflows/admin-pricing-roadmap-reconcile-once.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Replace stale pricing production note
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("modulex-admin/ADMIN_ROADMAP.md")
          text = path.read_text()
          old = "  - Production migration `20260901010000_pricing_product_type_routing.sql` is intentionally **not applied before merge**. Close this row only after merge, one-time production migration, exact merge-SHA Admin deployment, authenticated Product Prices/Material Bands acceptance, and post-DDL Supabase Security + Performance Advisor review."
          new = "  - Production contains the Product Type pricing routing migration and the exact #206 merge-SHA Admin deployment is READY. This row remains `[~]` only because authenticated Product Prices/Material Bands acceptance and post-DDL Security + Performance Advisor closeout were not independently reproduced in this session; do not re-run the migration or re-invent pricing behavior."
          if old not in text:
              raise SystemExit("stale pricing note not found")
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/admin-pricing-roadmap-reconcile-once.yml
      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulex-admin/ADMIN_ROADMAP.md .github/workflows/admin-pricing-roadmap-reconcile-once.yml
          git commit -m "docs(admin): reconcile pricing production status"
          git push origin "HEAD:${GITHUB_REF_NAME}"
