name: Admin UXA Accessibility Operations

on:
  pull_request:
    paths:
      - "modulex-admin/**"
      - ".github/workflows/admin-uxa.yml"
  push:
    branches:
      - "feat/uxa-accessibility-responsive-ops"
    paths:
      - "modulex-admin/**"
      - ".github/workflows/admin-uxa.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  uxa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - run: npm ci
      - name: UXA accessibility and responsive operations contract
        run: node scripts/uxa-operations-contract.mjs
      - name: Admin UI strict self-test
        run: npm run smoke:admin-ui-strict:self-test
      - name: Admin UI strict changed-file gate
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: npm run smoke:admin-ui-strict
      - name: Route regression
        run: node scripts/admin-full-route-regression-contract.mjs
      - name: Resolution matrix
        run: node scripts/admin-resolution-matrix-contract.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
        run: npm run build
