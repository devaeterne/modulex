name: A1.2C Apply UI Patch

on:
  push:
    branches:
      - phase-a1/order-lifecycle-editability

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci(admin): apply A1.2C UI patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply lifecycle UI and smoke wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {label}")
              if text.count(old) != 1:
                  raise SystemExit(f"non-unique patch anchor: {label}")
              return text.replace(old, new, 1)

          edit_path = Path("modulex-admin/src/components/customers/EditCustomerOrder.tsx")
          edit = edit_path.read_text()
          edit = replace_once(
              edit,
              'import {\n  loadEditOrderContext,',
              'import {\n  getCustomerOrderRevisionPolicy,\n  loadEditOrderContext,',
              'edit import',
          )
          edit = replace_once(
              edit,
              '  const selectedTaxRule = useMemo(() => taxRules.find((rule) => rule.fulfillment_type === fulfillmentType) ?? null, [taxRules, fulfillmentType]);\n',
              '  const selectedTaxRule = useMemo(() => taxRules.find((rule) => rule.fulfillment_type === fulfillmentType) ?? null, [taxRules, fulfillmentType]);\n  const revisionPolicy = useMemo(() => order && role ? getCustomerOrderRevisionPolicy(order.status, role) : null, [order, role]);\n',
              'revision policy memo',
          )
          edit = replace_once(
              edit,
              '    if (!order || order.status === "cancelled") return;\n',
              '    if (!order || !revisionPolicy?.canEdit) return setErrorMessage(revisionPolicy?.reason ?? "This order cannot be revised.");\n',
              'save guard',
          )
          edit = replace_once(
              edit,
              '  if (!customer || !order) return <div className="rounded-2xl border border-error-200 bg-error-50 p-6 text-error-700">{errorMessage || "Order not found."}</div>;\n\n  const defaultCommission',
              '  if (!customer || !order) return <div className="rounded-2xl border border-error-200 bg-error-50 p-6 text-error-700">{errorMessage || "Order not found."}</div>;\n  if (!revisionPolicy) return <div className="rounded-2xl border border-error-200 bg-error-50 p-6 text-error-700">Unable to resolve order revision policy.</div>;\n  if (!revisionPolicy.canEdit) return <div className="space-y-5"><div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"><div><h1 className="text-2xl font-semibold text-gray-800 dark:text-white/90">Revision Locked · {order.order_number}</h1><p className="mt-1 text-sm text-gray-500">{customer.name} • {revisionPolicy.reason}</p></div><Link href={`/customers/${customerId}/orders/${orderId}`} className="inline-flex h-10 items-center rounded-lg border border-gray-300 bg-white px-4 text-sm font-medium text-gray-700 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-300">Back to Order</Link></div><div className="rounded-2xl border border-warning-200 bg-warning-50 p-5 text-sm text-warning-800 dark:border-warning-500/20 dark:bg-warning-500/10 dark:text-warning-300"><p className="font-medium">Commercial revision is disabled for status {order.status.replaceAll("_", " ")}.</p><p className="mt-2">Order number, customer, status, currency, snapshots, calculated totals, and system metadata remain immutable. Status changes continue through the dedicated status workflow.</p></div></div>;\n\n  const defaultCommission',
              'locked route state',
          )
          edit = replace_once(
              edit,
              '{customer.name} • {order.status === "draft" ? "Draft changes are saved as revisions and checked against approval rules." : role === "sales" ? "Sales changes to this non-Draft order will be submitted for Admin approval before the live order changes." : "Changes create a revision snapshot."}',
              '{customer.name} • {revisionPolicy.reason}',
              'header policy description',
          )
          edit = replace_once(
              edit,
              'Recommended. For a Sales user, revisions to confirmed or later orders stay pending until Admin approval.',
              'Recommended. Sales revisions from Confirmed through Ready for Shipment stay pending until Admin approval; Shipped and later orders are revision-locked.',
              'revision helper text',
          )
          edit = replace_once(
              edit,
              'disabled={isSaving || isLoadingPrices || order.status === "cancelled"}',
              'disabled={isSaving || isLoadingPrices || !revisionPolicy.canEdit}',
              'save disabled state',
          )
          edit = replace_once(
              edit,
              '{isSaving ? "Saving..." : role === "sales" && order.status !== "draft" ? "Submit for Approval" : "Save Revision"}',
              '{isSaving ? "Saving..." : revisionPolicy.mode === "approval" ? "Submit for Approval" : "Save Revision"}',
              'save label',
          )
          edit_path.write_text(edit)

          pkg_path = Path("modulex-admin/package.json")
          pkg = pkg_path.read_text()
          pkg = replace_once(
              pkg,
              'npm run smoke:order-list && npm run smoke:order-domain && npm run smoke:secondary-cms-admin',
              'npm run smoke:order-list && npm run smoke:order-domain && npm run smoke:order-lifecycle && npm run smoke:secondary-cms-admin',
              'main smoke chain',
          )
          pkg = replace_once(
              pkg,
              '    "smoke:order-domain": "node scripts/order-domain-contract.mjs",\n',
              '    "smoke:order-domain": "node scripts/order-domain-contract.mjs",\n    "smoke:order-lifecycle": "node scripts/order-lifecycle-editability-contract.mjs",\n',
              'order lifecycle script',
          )
          pkg_path.write_text(pkg)
          PY
      - name: Remove temporary patch workflow
        run: rm .github/workflows/a12c-apply-ui.yml
      - name: Commit implementation patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulex-admin/src/components/customers/EditCustomerOrder.tsx modulex-admin/package.json .github/workflows/a12c-apply-ui.yml
          git commit -m "feat(admin): enforce order edit lifecycle in UI"
          git push origin HEAD:phase-a1/order-lifecycle-editability
