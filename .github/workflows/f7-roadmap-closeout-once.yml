name: F7 Roadmap Closeout Once

on:
  push:
    branches:
      - docs/a6-f7-production-closeout
    paths:
      - .github/workflows/f7-roadmap-closeout-once.yml

permissions:
  contents: write

jobs:
  patch-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/a6-f7-production-closeout
          fetch-depth: 0
      - name: Patch only F7 roadmap closeout text
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('modulex-admin/ADMIN_ROADMAP.md')
          text = path.read_text()
          original = text

          def sub(pattern, replacement, expected=1, flags=0, label='replacement'):
              global text
              text, count = re.subn(pattern, replacement, text, flags=flags)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} replacement(s), got {count}')

          sub(
              r'^Current parallel Admin package: \*\*A6-F7 Finance Hardening & Production Acceptance.*$',
              'Current parallel Admin package: **A6 Finance F0→F7 is complete and production-verified; there is no active Finance delivery package. Future Finance work requires a new explicitly scoped package.**',
              flags=re.M,
              label='top Finance status',
          )
          sub(
              r'^Current Admin next action: \*\*.*Finance.*$',
              'Current Admin next action: **Preserve the active non-Finance workstreams. The A6 Finance F0→F7 foundation is closed; do not reopen it implicitly from unrelated Project, HR, validation, Store, or operations work.**',
              flags=re.M,
              label='top next action',
          )
          sub(
              r'## A6-F7 Finance hardening status\n\n.*?\n\n## Customer read performance cleanup',
              '''## A6-F7 Finance hardening status\n\n- [x] Close the locked A6 operational Finance program with RLS/RPC/RBAC, idempotency/concurrency, append-safe reversal, FX/allocation reconciliation, Advisor-backed performance hardening and post-merge production acceptance.\n  - Implementation PR #349 merged as `c9dcebc552d61b79ed4609e670a9df2dda58b78c`.\n  - Production migration `20260907114208 — a6_finance_f7_hardening` is applied.\n  - All 24/24 targeted Finance/Finance-integration FK covering indexes exist in production.\n  - Browser EXECUTE on `private.guard_allocated_vendor_payment_void()` is revoked; reviewed Finance private cores expose no browser execute path and public Finance wrappers remain authenticated-only with the locked authorization/search-path boundary.\n  - Rollback-only production acceptance passed idempotent retry, changed-fingerprint rejection, posting, posted immutability, append-safe reversal, transaction-time FX snapshot, negative RBAC and zero-residue checks.\n  - Read-only reconciliation returned zero over-allocation, broken Finance links/reversals and checked context mismatches.\n  - Fresh Security/Performance Advisor review found no F7-specific blocking finding; unrelated project-wide advisor debt remains separate.\n  - Live Finance route/session-boundary smoke is healthy. Detailed evidence: `docs/acceptance/a6-f7-finance-hardening.md`.\n\n## Customer read performance cleanup''',
              flags=re.S,
              label='F7 status block',
          )
          sub(
              r'^- \[~\] \*\*A6-F7 — Finance hardening & production acceptance\.\*\*.*$',
              '- [x] **A6-F7 — Finance hardening & production acceptance.** Production migration, Advisor review, RBAC/ACL checks, reconciliation, rollback-only idempotency/reversal/FX acceptance and live Finance smoke are complete. Detailed evidence: `docs/acceptance/a6-f7-finance-hardening.md`.',
              flags=re.M,
              label='A6 F7 row',
          )
          sub(
              r'^- \[~\] Finance has one documented ownership model and staged F0→F7 delivery contract;.*$',
              '- [x] Finance has one documented ownership model and staged F0→F7 delivery contract; F0–F7 are complete/production-verified.',
              flags=re.M,
              label='A6 Finance ownership exit',
          )
          sub(
              r'^- \[~\] Finance Core production migration/advisor/deploy/signed-in acceptance is complete through F6;.*$',
              '- [x] Finance Core production migration/advisor/runtime acceptance is complete through F7; production mutation probes are rollback-only and leave zero acceptance residue.',
              flags=re.M,
              label='A6 Finance production exit',
          )
          sub(
              r'# Next Action\n\nKeep existing non-Finance workstreams in their own acceptance flows\. Finance F7 is the active closing package for the A6 Finance workstream\.\n\n1\..*?\n6\..*?\n\n(?=\*\*Cross-roadmap coordination:\*\*)',
              '''# Next Action\n\nKeep existing non-Finance workstreams in their own acceptance flows. The A6 Finance F0→F7 operational foundation is complete and production-verified.\n\n1. Do not reopen Finance F0→F7 implicitly from unrelated packages; any future Finance feature starts as a new explicitly scoped package against the locked Finance ownership model.\n2. Preserve Finance/Core regressions, authenticated-wrapper/private-core authorization, append-safe correction, stored FX snapshots and contextual allocation semantics while other roadmaps evolve.\n3. Continue the active non-Finance Project/validation/Store/Admin workstreams according to their own merge and production acceptance gates.\n\n''',
              flags=re.S,
              label='Next Action Finance closeout',
          )

          if text == original:
              raise SystemExit('roadmap did not change')
          path.write_text(text)
          PY
      - name: Commit roadmap closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulex-admin/ADMIN_ROADMAP.md
          git diff --cached --check
          git commit -m "docs(admin): close A6 F7 roadmap status"
          git push origin HEAD:docs/a6-f7-production-closeout
