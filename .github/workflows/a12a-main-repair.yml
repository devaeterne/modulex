name: A1.2A main repair verification

on:
  push:
    branches:
      - repair/a12a-order-list-main

jobs:
  verify-admin:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - name: Install dependencies
        working-directory: modulex-admin
        run: npm ci
      - name: Runtime config contract
        working-directory: modulex-admin
        run: npm run smoke:runtime-config
      - name: RBAC contract
        working-directory: modulex-admin
        run: npm run smoke:rbac
      - name: Production surface contract
        working-directory: modulex-admin
        run: npm run smoke:production-surface
      - name: Customer directory contract
        working-directory: modulex-admin
        run: npm run smoke:customer-directory
      - name: Customer master contract
        working-directory: modulex-admin
        run: npm run smoke:customer-master
      - name: Customer detail contract
        working-directory: modulex-admin
        run: npm run smoke:customer-detail
      - name: Order list contract
        working-directory: modulex-admin
        run: npm run smoke:order-list
      - name: Secondary CMS contract
        working-directory: modulex-admin
        run: npm run smoke:secondary-cms-admin
      - name: Media library contract
        working-directory: modulex-admin
        run: npm run smoke:media-library-admin
      - name: GC-2D media intake contract
        working-directory: modulex-admin
        run: npm run smoke:gc2d-media-intake
      - name: Dealer onboarding contract
        working-directory: modulex-admin
        run: npm run smoke:dealer-onboarding
      - name: Dealer portal Admin contract
        working-directory: modulex-admin
        run: npm run smoke:dealer-portal-admin
      - name: Store portal Admin contract
        working-directory: modulex-admin
        run: npm run smoke:store-portal-admin
      - name: Auth recovery contract
        working-directory: modulex-admin
        run: npm run smoke:auth-recovery
      - name: Polling contract
        working-directory: modulex-admin
        run: npm run smoke:polling
      - name: Lint
        working-directory: modulex-admin
        run: npm run lint
      - name: Production build
        working-directory: modulex-admin
        run: npm run build
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
