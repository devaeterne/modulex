name: Project Proposal P3 Tracker Patch

on:
  push:
    branches:
      - feat/project-proposal-lifecycle-ux
    paths:
      - .github/workflows/project-proposal-p3-tracker.yml
      - modulex-admin/scripts/project-proposal-p3-tracker.mjs

permissions:
  contents: write

jobs:
  patch-trackers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-proposal-lifecycle-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Proposal trackers
        run: node modulex-admin/scripts/project-proposal-p3-tracker.mjs
      - name: Commit tracker updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_PROPOSAL_PLAN.md modulex-admin/ADMIN_ROADMAP.md
          if git diff --cached --quiet; then
            echo "No tracker changes required"
            exit 0
          fi
          git commit -m "docs(project): align Proposal P3 trackers [skip ci]"
          git push origin HEAD:feat/project-proposal-lifecycle-ux
