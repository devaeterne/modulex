name: Customer Domain Closeout

on:
  pull_request:
    paths:
      - "modulex-admin/scripts/customer-production-acceptance*.mjs"
      - "modulex-admin/docs/acceptance/**"
      - ".github/workflows/customer-domain-closeout.yml"
  push:
    paths:
      - "modulex-admin/scripts/customer-production-acceptance*.mjs"
      - "modulex-admin/docs/acceptance/**"
      - ".github/workflows/customer-domain-closeout.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  customer-production-acceptance-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Customer production acceptance harness contract
        run: node scripts/customer-production-acceptance-contract.mjs
