name: Admin Project Base

on:
  pull_request:
    paths:
      - "modulex-admin/src/app/(admin)/projects/**"
      - "modulex-admin/src/app/api/admin/projects/**"
      - "modulex-admin/src/components/projects/**"
      - "modulex-admin/src/components/customers/project-detail/**"
      - "modulex-admin/src/lib/projects/**"
      - "modulex-admin/src/lib/customers/project-*.ts"
      - "modulex-admin/src/lib/auth/permissions.ts"
      - "modulex-admin/src/layout/AppSidebar.tsx"
      - "modulex-admin/scripts/project-*.mjs"
      - "modulex-admin/scripts/project-import/**"
      - "modulex-admin/scripts/cost-*.mjs"
      - "modulex-admin/scripts/countertop-sink-fallback-contract.mjs"
      - "modulex-admin/sql/project-*.sql"
      - "modulex-store/supabase/migrations/*project*.sql"
      - "modulex-store/supabase/migrations/*procurement*.sql"
      - "modulex-store/supabase/migrations/*payment*.sql"
      - "modulex-store/supabase/migrations/*commission*.sql"
      - "modulex-store/supabase/migrations/*cost*.sql"
      - "modulex-store/src/lib/portal/projects.ts"
      - "modulex-store/src/components/portal/PortalProject*.tsx"
      - "modulex-store/src/components/portal/PortalNavigation.tsx"
      - "modulex-store/src/app/account/(portal)/projects/**"
      - "modulex-store/src/app/dealer/(portal)/projects/**"
      - "modulex-store/STORE_ROADMAP.md"
      - "docs/PROJECT_BASE_PLAN.md"
      - "docs/acceptance/*project*.md"
      - "docs/acceptance/*payment*.md"
      - "docs/acceptance/*commission*.md"
      - ".github/workflows/admin-project-base.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  project-base-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - run: npm ci
      - name: Project Base contract
        run: node scripts/project-base-contract.mjs
      - name: Project Progress layout contract
        run: node scripts/project-progress-layout-contract.mjs
      - name: Project Financial rollup contract
        run: node scripts/project-financial-rollup-contract.mjs
      - name: Cost & Profitability hardening contract
        run: node scripts/cost-profitability-hardening-contract.mjs
      - name: Project Payment Ledger contract
        run: node scripts/project-payment-ledger-contract.mjs
      - name: Project Payment edit/delete audit contract
        run: node scripts/project-payment-edit-delete-contract.mjs
      - name: Project F5C payment hardening contract
        run: node scripts/project-f5c-payment-hardening-contract.mjs
      - name: Project Finance simple flow contract
        run: node scripts/project-finance-simple-flow-contract.mjs
      - name: Project Procurement contract
        run: node scripts/project-procurement-contract.mjs
      - name: Project PB-5 Fulfillment contract
        run: node scripts/project-pb5-fulfillment-contract.mjs
      - name: Project PB-6 Participants & Commission contract
        run: node scripts/project-pb6-participants-commission-contract.mjs
      - name: Project PB-6 tab access + percentage basis contract
        run: node scripts/project-pb6-tab-access-percentage-basis-contract.mjs
      - name: Project PB-6 gross profit commission contract
        run: node scripts/project-pb6-gross-profit-commission-contract.mjs
      - name: Project PB-6 deterministic commission event ordering contract
        run: node scripts/project-pb6-commission-event-ordering-contract.mjs
      - name: Project PB-7 Change Orders contract
        run: node scripts/project-pb7-change-orders-contract.mjs
      - name: Project PB-7 performance hardening contract
        run: node scripts/project-pb7-performance-hardening-contract.mjs
      - name: Project PB-8 Portal Project projection contract
        run: node scripts/project-pb8-portal-projection-contract.mjs
      - name: Project PB-9 Historical Excel Import contract
        run: node scripts/project-pb9-historical-import-contract.mjs
      - name: Project PB-9 Historical Excel Import Admin UI contract
        run: node scripts/project-pb9-historical-import-ui-contract.mjs
      - name: Project PB-9 XLSX extractor self-test
        run: python3 scripts/project-import/project_excel_extract.py --self-test
      - name: Project PB-9 import FK hardening contract
        run: node scripts/project-pb9-import-fk-hardening-contract.mjs
      - name: Project Proposal Core contract
        run: node scripts/project-proposal-core-contract.mjs
      - name: Project Proposal P6 conversion contract
        run: node scripts/project-proposal-order-conversion-contract.mjs
      - name: Project Proposal P6 UUID aggregate hotfix contract
        run: node scripts/project-proposal-order-conversion-uuid-aggregate-contract.mjs
      - name: Countertop Sink fallback contract
        run: node scripts/countertop-sink-fallback-contract.mjs
