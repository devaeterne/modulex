name: Admin Project Base

on:
  pull_request:
    paths:
      - "modulex-admin/**"
      - "modulex-store/supabase/migrations/**"
      - ".github/workflows/admin-project-base.yml"
      - "docs/PROJECT_BASE_PLAN.md"
  workflow_dispatch:

jobs:
  project-base-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - run: npm ci
      - name: Project Base contract
        run: node scripts/project-base-contract.mjs
      - name: Project Progress layout contract
        run: node scripts/project-progress-layout-contract.mjs
      - name: Project Financial rollup contract
        run: node scripts/project-financial-rollup-contract.mjs
      - name: Project Payment Ledger contract
        run: node scripts/project-payment-ledger-contract.mjs
      - name: Project Payment edit/delete audit contract
        run: node scripts/project-payment-edit-delete-contract.mjs
      - name: Project Finance simple flow contract
        run: node scripts/project-finance-simple-flow-contract.mjs
      - name: Countertop Sink fallback contract
        run: node scripts/countertop-sink-fallback-contract.mjs
