name: Admin Customers UI
on:
  push:
    paths: ["modulex-admin/src/app/(admin)/customers/**", "modulex-admin/src/components/customers/**", "modulex-admin/scripts/customers-ui-contract.mjs", ".github/workflows/admin-customers-ui.yml"]
  pull_request:
    paths: ["modulex-admin/src/app/(admin)/customers/**", "modulex-admin/src/components/customers/**", "modulex-admin/scripts/customers-ui-contract.mjs", ".github/workflows/admin-customers-ui.yml"]
permissions: { contents: read }
jobs:
  customers-verification:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: modulex-admin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: modulex-admin/package-lock.json }
      - run: npm ci
      - name: Customers UI contract
        run: node scripts/customers-ui-contract.mjs
      - name: Production surface regression
        run: npm run smoke:production-surface
      - name: RBAC regression
        run: npm run smoke:rbac
      - name: Lint
        run: npm run lint
      - name: Build
        env: { NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key }
        run: npm run build
