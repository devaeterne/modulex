name: A0.3 Final Verify

on:
  push:
    branches:
      - phase-a0/admin-runtime-config-cleanup

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://bzjoeernnmvuhzyvbowc.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_if_qoUqt9Zb0cBBYew5V2w_Jt2do0V5
      NEXT_PUBLIC_SITE_URL: https://modulex-admin.example.test
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile latest main baseline in Admin docs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = "7b19a5cf417092c6088aff91747e4c1da7c0019f"
          new = "23e5d365876dc65dae9a46645f0627d8f38bc683"
          for filename in ["ADMIN_ROADMAP.md", "docs/ADMIN_RUNTIME_CONFIG.md"]:
              path = Path(filename)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"expected old baseline in {filename}")
              path.write_text(text.replace(old, new, 1))
          PY
          if ! git diff --quiet -- ADMIN_ROADMAP.md docs/ADMIN_RUNTIME_CONFIG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ADMIN_ROADMAP.md docs/ADMIN_RUNTIME_CONFIG.md
            git commit -m "docs(admin): reconcile A0.3 with latest main"
            git push
            exit 0
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Runtime config
        run: npm run smoke:runtime-config
      - name: Production surface
        run: npm run smoke:production-surface
      - name: RBAC
        run: npm run smoke:rbac
      - name: Secondary CMS Admin
        run: npm run smoke:secondary-cms-admin
      - name: Dealer onboarding
        run: npm run smoke:dealer-onboarding
      - name: Dealer portal Admin
        run: npm run smoke:dealer-portal-admin
      - name: Store portal Admin
        run: npm run smoke:store-portal-admin
      - name: Auth recovery
        run: npm run smoke:auth-recovery
      - name: Polling
        run: npm run smoke:polling
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check 23e5d365876dc65dae9a46645f0627d8f38bc683...HEAD -- .
