name: Verify Phase 2.1C

on:
  push:
    branches:
      - phase-2-1/c-store-public-pages

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://bzjoeernnmvuhzyvbowc.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_if_qoUqt9Zb0cBBYew5V2w_Jt2do0V5
      NEXT_PUBLIC_SITE_URL: https://oakwell-phi.vercel.app
    defaults:
      run:
        working-directory: modulex-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modulex-store/package-lock.json
      - run: npm ci
      - name: Phase 2.1C public content contract
        run: npm run smoke:store-public-content
      - name: Public production contract
        run: npm run smoke:public-production
      - name: Lint
        run: npm run lint
      - name: Full Store smoke
        run: npm run smoke
      - name: Build
        run: npm run build
      - name: Reconcile Store and Admin roadmaps
        working-directory: .
        run: |
          node .github/scripts/reconcile-phase-2-1-c-roadmaps.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulex-store/STORE_ROADMAP.md modulex-admin/ADMIN_ROADMAP.md
          git commit -m "docs: reconcile Phase 2.1C roadmaps [skip ci]"
          git push
