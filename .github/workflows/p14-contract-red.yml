name: P1.4 Verification

on:
  push:
    branches:
      - phase-1/unified-account-order-access

env:
  NEXT_PUBLIC_SUPABASE_URL: https://bzjoeernnmvuhzyvbowc.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_if_qoUqt9Zb0cBBYew5V2w_Jt2do0V5

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Store install
        working-directory: modulex-store
        run: npm ci
      - name: Store smoke
        working-directory: modulex-store
        run: npm test
      - name: Store P1.4 scoped lint
        working-directory: modulex-store
        run: >-
          npx eslint
          src/components/Navbar.tsx
          src/components/StoreChrome.tsx
          src/lib/portal/auth.ts
          src/lib/portal/orders.ts
          'src/app/account/(auth)/login/actions.ts'
          'src/app/account/(auth)/login/AccountLoginForm.tsx'
          'src/app/account/(auth)/login/page.tsx'
          'src/app/account/(auth)/forgot-password/AccountForgotPasswordForm.tsx'
          'src/app/account/(auth)/forgot-password/page.tsx'
          'src/app/account/(auth)/reset-password/AccountResetPasswordForm.tsx'
          'src/app/account/(auth)/reset-password/page.tsx'
          src/app/account/activate/AccountActivationForm.tsx
          src/app/account/activate/page.tsx
          src/app/account/session/clear/route.ts
          'src/app/account/(portal)/actions.ts'
          'src/app/account/(portal)/layout.tsx'
          'src/app/account/(portal)/page.tsx'
          'src/app/account/(portal)/orders/page.tsx'
          'src/app/account/(portal)/orders/[id]/page.tsx'
          src/lib/dealer/auth.ts
          'src/app/dealer/(auth)/login/actions.ts'
          'src/app/dealer/(auth)/reset-password/DealerResetPasswordForm.tsx'
          'src/app/dealer/(portal)/layout.tsx'
          'src/app/dealer/(portal)/page.tsx'
          'src/app/dealer/(portal)/orders/page.tsx'
          'src/app/dealer/(portal)/orders/[id]/page.tsx'
          src/components/portal/PortalOrderList.tsx
          src/components/portal/PortalOrderDetail.tsx
          src/proxy.ts
      - name: Store production build
        working-directory: modulex-store
        run: npm run build

      - name: Admin install
        working-directory: modulex-admin
        run: npm ci
      - name: Admin P1.4 and regression contracts
        working-directory: modulex-admin
        run: npm run smoke:store-portal-admin && npm run smoke:dealer-portal-admin && npm run smoke:auth-recovery
      - name: Admin P1.4 scoped lint
        working-directory: modulex-admin
        run: >-
          npx eslint
          'src/app/api/admin/dealer-portal/route.ts'
          src/lib/email/dealer-portal.ts
      - name: Admin production build
        working-directory: modulex-admin
        run: npm run build
