name: Temporary PB-6 follow-up patch

on:
  push:
    branches:
      - fix/pb6-project-tab-permissions-percentage-basis
    paths:
      - "modulex-admin/scripts/apply-pb6-tab-basis-patch.mjs"
      - ".github/workflows/tmp-pb6-followup-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pb6-project-tab-permissions-percentage-basis
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply deterministic patch
        working-directory: modulex-admin
        run: node scripts/apply-pb6-tab-basis-patch.mjs
      - name: Commit patched sources and remove temporary machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm modulex-admin/scripts/apply-pb6-tab-basis-patch.mjs .github/workflows/tmp-pb6-followup-patch.yml
          git add modulex-admin/src/components/customers/ProjectDetailWorkspace.tsx \
                  modulex-admin/src/app/'(admin)'/projects/'[id]'/page.tsx \
                  modulex-admin/src/lib/customers/project-participants-commission-domain.ts \
                  modulex-admin/src/components/customers/project-detail/ProjectParticipantsCommissionPanel.tsx \
                  modulex-admin/scripts/project-pb6-participants-commission-contract.mjs \
                  docs/acceptance/pb-6-project-participants-commission.md
          git commit -m "fix(project): integrate restricted PB-6 tab and basis preview"
          git push origin HEAD:fix/pb6-project-tab-permissions-percentage-basis
