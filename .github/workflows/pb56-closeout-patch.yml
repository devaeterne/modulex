name: PB56 closeout patch

on:
  push:
    branches:
      - docs/pb5-pb6-production-closeout

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/pb5-pb6-production-closeout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/pb56_closeout_patch.py
      - name: Commit closeout docs
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_BASE_PLAN.md modulex-admin/ADMIN_ROADMAP.md docs/acceptance/pb-5-project-fulfillment.md docs/acceptance/pb-6-project-participants-commission.md modulex-admin/docs/acceptance/pb-6-commission-event-ordering-hardening.md
          git commit -m "docs(project): record PB-5 PB-6 production closeout"
          git push origin HEAD:docs/pb5-pb6-production-closeout
