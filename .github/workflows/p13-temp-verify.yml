name: P1.3 Temporary Verification

on:
  push:
    branches:
      - phase-1/dealer-login-protected-shell

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://bzjoeernnmvuhzyvbowc.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_if_qoUqt9Zb0cBBYew5V2w_Jt2do0V5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate Store dependency lock
        working-directory: modulex-store
        run: npm install --save-exact --package-lock-only @supabase/supabase-js@2.105.3 @supabase/ssr@0.10.3

      - name: Install Store
        working-directory: modulex-store
        run: npm ci

      - name: Test Store
        working-directory: modulex-store
        run: npm test

      - name: Lint P1.3 Store changes
        working-directory: modulex-store
        run: >-
          npx eslint
          src/app/layout.tsx
          src/app/dealer
          src/components/Footer.tsx
          src/components/StoreChrome.tsx
          src/lib/dealer
          src/lib/supabase/browser.ts
          src/lib/supabase/server.ts
          src/lib/supabase/proxy.ts
          src/proxy.ts
          scripts/dealer-portal-auth-contract.mjs

      - name: Build Store
        working-directory: modulex-store
        env:
          NEXT_PUBLIC_SITE_URL: https://oakwell-phi.vercel.app
        run: npm run build

      - name: Install Admin
        working-directory: modulex-admin
        run: npm ci

      - name: Test Admin recovery contracts
        working-directory: modulex-admin
        run: npm run smoke:dealer-portal-admin && npm run smoke:auth-recovery

      - name: Lint P1.3 Admin changes
        working-directory: modulex-admin
        run: >-
          npx eslint
          src/components/auth/ResetPasswordForm.tsx
          scripts/auth-recovery-contract.mjs
          scripts/dealer-portal-auth-live-smoke.mjs

      - name: Build Admin
        working-directory: modulex-admin
        env:
          NEXT_PUBLIC_SITE_URL: https://admin.oakwellcabinetry.com
        run: npm run build

      - name: Commit generated Store dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulex-store/package.json modulex-store/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "chore: add store supabase ssr dependencies"
            git push origin HEAD:phase-1/dealer-login-protected-shell
          fi
