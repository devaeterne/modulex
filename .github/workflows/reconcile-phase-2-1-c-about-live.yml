name: Reconcile Phase 2.1C About live acceptance

on:
  push:
    branches:
      - docs/phase-2-1-c-about-live-acceptance

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update roadmaps
        run: node .github/scripts/reconcile-phase-2-1-c-about-live.mjs
      - name: Commit roadmap updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulex-store/STORE_ROADMAP.md modulex-admin/ADMIN_ROADMAP.md
          git commit -m "docs: record Phase 2.1C About live acceptance [skip ci]"
          git push
