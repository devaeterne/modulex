name: A1.1C roadmap closeout apply

on:
  push:
    branches:
      - docs/admin-a1-1c-production-acceptance

permissions:
  contents: write

jobs:
  apply-roadmap-closeout:
    if: ${{ !contains(github.event.head_commit.message, '[skip a11c-closeout]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply roadmap closeout
        working-directory: modulex-admin
        run: node scripts/apply-a11c-closeout.mjs
      - name: Commit roadmap update
        run: |
          if git diff --quiet -- modulex-admin/ADMIN_ROADMAP.md; then
            exit 0
          fi
          git config user.name "devaeterne"
          git config user.email "info@safaksariyildiz.com"
          git add modulex-admin/ADMIN_ROADMAP.md
          git commit -m "docs(admin): close A1.1C production acceptance [skip a11c-closeout]"
          git push
