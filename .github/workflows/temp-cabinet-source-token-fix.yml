name: Temporary Cabinet Source Token Fix

on:
  push:
    branches:
      - fix/order-cabinet-source-choice

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/order-cabinet-source-choice
          fetch-depth: 0
      - name: Use shared Admin text token
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('modulex-admin/src/components/customers/NewCustomerOrder.tsx')
          text = path.read_text()
          text = text.replace(
              'import { Modal } from "@/components/ui/modal";\n',
              'import { Modal } from "@/components/ui/modal";\nimport { ADMIN_TEXT_STYLES } from "@/components/ui/theme/adminTheme";\n',
              1,
          )
          old = '<h3 className="text-base font-medium text-gray-800 dark:text-white/90">Choose Cabinet Source</h3>'
          new = '<h3 className={`text-base font-medium ${ADMIN_TEXT_STYLES.strong}`}>Choose Cabinet Source</h3>'
          if old not in text:
              raise SystemExit('Expected Cabinet source heading not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          Path('.github/workflows/temp-cabinet-source-token-fix.yml').unlink()
          PY
      - name: Verify focused contract
        working-directory: modulex-admin
        run: node scripts/order-custom-vendor-cabinet-contract.mjs
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulex-admin/src/components/customers/NewCustomerOrder.tsx .github/workflows/temp-cabinet-source-token-fix.yml
          git commit -m "fix(orders): use shared text token in Cabinet source modal"
          git push origin HEAD:fix/order-cabinet-source-choice
