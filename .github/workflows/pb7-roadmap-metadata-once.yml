name: PB-7 Roadmap Metadata Once

on:
  push:
    branches:
      - docs/pb7-production-closeout
    paths:
      - .github/workflows/pb7-roadmap-metadata-once.yml

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/pb7-production-closeout
      - name: Update tracker metadata
        run: |
          python -c 'from pathlib import Path; p=Path("docs/PROJECT_BASE_PLAN.md"); t=p.read_text(); assert t.count("Last reviewed: 2026-09-07")==1; p.write_text(t.replace("Last reviewed: 2026-09-07","Last reviewed: 2026-09-08",1))'
          python -c 'from pathlib import Path; p=Path("modulex-admin/ADMIN_ROADMAP.md"); t=p.read_text(); old="Main baseline: "+chr(96)+"ab23762e3558204a24b2400fb6603391f1322eb1"+chr(96); new="Main baseline: "+chr(96)+"2b6946b520d8cd0817600a08f4c72527a58e45e1"+chr(96); assert t.count("Last reviewed: 2026-09-07")==1; assert t.count(old)==1; t=t.replace("Last reviewed: 2026-09-07","Last reviewed: 2026-09-08",1).replace(old,new,1); p.write_text(t)'
      - name: Commit tracker metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_BASE_PLAN.md modulex-admin/ADMIN_ROADMAP.md
          git diff --cached --check
          git commit -m "docs(project): align PB-7 closeout metadata"
          git push origin HEAD:docs/pb7-production-closeout
