name: Store Showroom SEO

on:
  pull_request:
    paths:
      - "modulex-admin/src/components/store/StorePagesManager.tsx"
      - "modulex-admin/src/lib/store/secondaryCms.ts"
      - "modulex-store/package.json"
      - "modulex-store/scripts/seo-showroom-cms-contract.mjs"
      - "modulex-store/src/app/layout.tsx"
      - "modulex-store/src/app/showroom/page.tsx"
      - "modulex-store/src/app/sitemap.ts"
      - "modulex-store/src/lib/seo/structured-data.ts"
      - "modulex-store/src/lib/store/content/queries.ts"
      - ".github/workflows/store-seo-showroom.yml"

permissions:
  contents: read

jobs:
  store-seo-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-store
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modulex-store/package-lock.json
      - name: Install
        run: npm ci
      - name: Showroom SEO CMS contract
        run: node scripts/seo-showroom-cms-contract.mjs
      - name: Company public regression
        run: node scripts/gc3-company-public-contract.mjs
      - name: Gallery projects regression
        run: node scripts/gc5-gallery-projects-contract.mjs
      - name: Gallery freshness regression
        run: node scripts/gallery-freshness-filter-contract.mjs
      - name: Gallery theme regression
        run: node scripts/gallery-theme-contract.mjs
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          NEXT_PUBLIC_SITE_URL: https://oakwellcabinetry.com
        run: npm run build

  admin-cms-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
        run: npm run build
