name: GC-6 RBAC Route Fix

on:
  push:
    branches:
      - feat/gc6-cabinet-journey
    paths:
      - ".github/workflows/gc6-rbac-route-fix.yml"

permissions:
  contents: write

jobs:
  patch-route-rule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gc6-cabinet-journey
      - name: Require store.manage for Cabinet Content
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("modulex-admin/src/lib/auth/permissions.ts")
          text = p.read_text()
          needle = '      path === "/store/pages" ||\n      path.startsWith("/store/pages/") ||\n'
          replacement = needle + '      path === "/store/cabinet-content" ||\n      path.startsWith("/store/cabinet-content/") ||\n'
          if 'path === "/store/cabinet-content"' not in text:
              if needle not in text:
                  raise SystemExit("Store Pages route rule anchor not found")
              text = text.replace(needle, replacement, 1)
              p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulex-admin/src/lib/auth/permissions.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(admin): guard Cabinet Content with store.manage"
            git push origin HEAD:feat/gc6-cabinet-journey
          fi
