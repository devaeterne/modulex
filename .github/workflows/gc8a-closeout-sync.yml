name: GC8A Closeout Sync

on:
  push:
    branches:
      - docs/gc8a-production-closeout
    paths:
      - ".github/workflows/gc8a-closeout-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/gc8a-production-closeout
      - name: Patch closeout roadmaps
        run: |
          python - <<'PY'
          from pathlib import Path

          store = Path("modulex-store/STORE_ROADMAP.md")
          text = store.read_text()
          replacements = {
              "Main baseline: `cc670f511225c6e57b48c1bae321ef986f7da93c`": "Main baseline: `d41f7c19ce81016b6a1a05166d0a4089104bfe52`",
              "Current Granite migration status: **GC-5, GC-6 and GC-7 are production-accepted. GC-7 live homepage acceptance is recorded after PR #167 / commit `74013f90561e023b0453aea57cd010456de2c597`. GC-8A — managed public navigation/footer + technical SEO — is implementation/data/CI complete on its conflict-safe latest-main branch; PR merge/deploy and live acceptance remain the final closeout gate before `[x]`.**": "Current Granite migration status: **GC-5, GC-6, GC-7 and GC-8A are production-accepted. GC-8A live acceptance is recorded after PR #169 / merge commit `d41f7c19ce81016b6a1a05166d0a4089104bfe52`; managed public chrome, portal coexistence and technical SEO are verified live. GC-8B — accessibility + performance acceptance — is the active next package.**",
              "- [~] GC-8 — Navigation/footer, SEO, accessibility & performance QA. GC-8A implementation/data/CI complete; live acceptance pending, GC-8B remains next.": "- [~] GC-8 — Navigation/footer, SEO, accessibility & performance QA. GC-8A is production-accepted; GC-8B accessibility/performance acceptance remains the final GC-8 package.",
              "# Next Action\n\n1. Merge/deploy **GC-8A — managed Store chrome + technical SEO** only after final branch CI is green and the PR remains `behind_by = 0`.\n2. Post-merge, verify live public nav/footer order, portal coexistence, Oakwell-facing Organization JSON-LD with Granite & Cabinet Center as distinct parent, managed-title de-duplication, canonical/robots/sitemap behavior, and no Granite runtime backend/media dependency; then mark GC-8A `[x]` in the closeout.\n3. Proceed to **GC-8B — accessibility/mobile/keyboard + Lighthouse/Core Web Vitals baseline/tuning**.": "# Next Action\n\n1. Execute **GC-8B — accessibility/mobile/keyboard + Lighthouse/Core Web Vitals baseline/tuning** from latest `main`.\n2. Keep GC-8 `[~]` until accessibility, performance, indexing and final live acceptance all pass; then close the overall GC-8 exit gate.\n3. Preserve the permanent architecture boundary: Granite Center remains provenance/migration evidence only, never a runtime content or media backend."
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"STORE_ROADMAP marker missing: {old[:120]}")
              text = text.replace(old, new, 1)
          store.write_text(text)

          migration = Path("modulex-store/docs/OAKWELL_GRANITE_CENTER_MIGRATION_ROADMAP.md")
          m = migration.read_text()
          migration_replacements = {
              "Status: `[~]` implementation/data/CI complete; PR merge/deploy + live acceptance pending.": "Status: `[x]` production-accepted on 2026-08-30 after PR #169 merge/deploy and live verification.",
              "- `[~]` post-merge live acceptance: nav/footer, portal coexistence, JSON-LD, titles, canonical/robots/sitemap and deployment commit match.": "- `[x]` post-merge live acceptance: production deployment matches merge commit `d41f7c19ce81016b6a1a05166d0a4089104bfe52`; nav/footer ordering, `/account` + `/dealer` coexistence, Oakwell Organization/Brand JSON-LD with Granite parent attribution, managed-title de-duplication, canonical/robots/sitemap behavior and Granite runtime-backend/media independence are verified live.",
              "**GC-8A exit gate:** code/data/CI are complete; mark `[x]` only after merge/deploy and live production acceptance.": "**GC-8A exit gate:** `[x]` code/data/CI, merge/deploy and live production acceptance are complete. Acceptance record: `docs/granite-center/GC8A_PRODUCTION_ACCEPTANCE.md`.",
              "# 10. Next Action\n\n1. Complete GC-8A PR merge/deploy and live acceptance; do not mark GC-8A `[x]` before the production deployment/commit and public/portal/SEO checks pass.\n2. Then execute **GC-8B — accessibility/mobile/keyboard + Lighthouse/Core Web Vitals baseline/tuning** from the latest `main`.\n3. Preserve the permanent architecture boundary: Granite Center remains provenance/migration evidence only, never a runtime content or media backend.": "# 10. Next Action\n\n1. Execute **GC-8B — accessibility/mobile/keyboard + Lighthouse/Core Web Vitals baseline/tuning** from latest `main`.\n2. Close overall GC-8 only after accessibility, performance, indexing and final production verification pass.\n3. Preserve the permanent architecture boundary: Granite Center remains provenance/migration evidence only, never a runtime content or media backend."
          }
          for old, new in migration_replacements.items():
              if old not in m:
                  raise SystemExit(f"Migration roadmap marker missing: {old[:120]}")
              m = m.replace(old, new, 1)
          migration.write_text(m)
          PY
      - name: Commit closeout roadmaps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulex-store/STORE_ROADMAP.md modulex-store/docs/OAKWELL_GRANITE_CENTER_MIGRATION_ROADMAP.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(store): mark GC-8A production accepted"
          git push origin HEAD:docs/gc8a-production-closeout
