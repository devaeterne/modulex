name: A1 Roadmap Closeout

on:
  push:
    branches:
      - feat/a1-core-operations-hardening-active
    paths:
      - ".github/workflows/a1-roadmap-closeout.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/a1-core-operations-hardening-active
      - name: Sync A2 header wording
        shell: python
        run: |
          from pathlib import Path
          path = Path("modulex-admin/ADMIN_ROADMAP.md")
          text = path.read_text()
          old = "Admin primary Phase A1 work remains independently owned by its current roadmap next action."
          new = "Admin primary roadmap work has advanced to Phase A2 after verified A1 closeout."
          if old not in text:
              raise SystemExit("Expected stale A1 header wording was not found")
          path.write_text(text.replace(old, new, 1))
      - name: Commit header sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulex-admin/ADMIN_ROADMAP.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: sync A2 roadmap header"
          git push origin HEAD:feat/a1-core-operations-hardening-active
