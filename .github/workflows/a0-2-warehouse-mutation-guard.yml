name: A0.2 Warehouse mutation guard

on:
  push:
    branches:
      - hotfix/admin-warehouse-list-mutation-rbac
    paths:
      - modulex-admin/**
      - .github/workflows/a0-2-warehouse-mutation-guard.yml

permissions:
  contents: write

jobs:
  rbac:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved warehouse mutation guard
        run: python scripts/apply-warehouse-mutation-guard.py
      - name: Commit approved warehouse mutation guard
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/warehouses/WarehousesTable.tsx src/components/zones/ZonesTable.tsx src/components/locations/LocationsTable.tsx
          git commit -m "fix(admin): gate warehouse list mutations"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - run: npm ci
      - run: npm run smoke:rbac
