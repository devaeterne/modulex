name: A0.2 Warehouse mutation guard

on:
  push:
    branches:
      - hotfix/admin-warehouse-list-mutation-rbac
    paths:
      - modulex-admin/**
      - .github/workflows/a0-2-warehouse-mutation-guard.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply roadmap closeout and remove temporary CI files
        run: python scripts/apply-warehouse-mutation-guard.py
      - name: Verify closeout diff
        run: git -C .. diff --check
      - name: Commit closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add -A
          git -C .. commit -m "docs: close warehouse mutation RBAC follow-up [skip ci]"
          git -C .. push
