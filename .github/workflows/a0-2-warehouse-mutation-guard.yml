name: A0.2 Warehouse mutation guard

on:
  push:
    branches:
      - hotfix/admin-warehouse-list-mutation-rbac
    paths:
      - modulex-admin/**
      - .github/workflows/a0-2-warehouse-mutation-guard.yml

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://bzjoeernnmvuhzyvbowc.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_if_qoUqt9Zb0cBBYew5V2w_Jt2do0V5

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - run: npm ci
      - name: RBAC contract
        run: npm run smoke:rbac
      - name: Production surface contract
        run: npm run smoke:production-surface
      - name: Secondary CMS Admin contract
        run: npm run smoke:secondary-cms-admin
      - name: Dealer onboarding contract
        run: npm run smoke:dealer-onboarding
      - name: Dealer portal Admin contract
        run: npm run smoke:dealer-portal-admin
      - name: Store portal Admin contract
        run: npm run smoke:store-portal-admin
      - name: Auth recovery contract
        run: npm run smoke:auth-recovery
      - name: Polling contract
        run: npm run smoke:polling
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git -C .. diff --check f248d04864c9e55111d416f99a1cced4ee4f02f3...HEAD
