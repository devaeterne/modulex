name: Admin A1 Core Operations

on:
  push:
    paths:
      - "modulex-admin/src/app/(admin)/customers/**/orders/**"
      - "modulex-admin/src/components/customers/CustomerOrder*.tsx"
      - "modulex-admin/src/components/customers/CustomerInvoice*.tsx"
      - "modulex-admin/src/components/customers/CustomerShipmentDetailRBAC.tsx"
      - "modulex-admin/src/components/customers/CustomerInstallationDetail.tsx"
      - "modulex-admin/src/lib/customers/order-domain.ts"
      - "modulex-admin/src/lib/customers/project-domain.ts"
      - "modulex-admin/src/lib/auth/permissions.ts"
      - "modulex-admin/scripts/a1-*.mjs"
      - "modulex-admin/scripts/order-*.mjs"
      - "modulex-admin/scripts/val3-*.mjs"
      - "modulex-admin/scripts/dealer-portal-admin-contract.mjs"
      - "modulex-admin/scripts/store-portal-admin-contract.mjs"
      - "modulex-admin/sql/a1-*.sql"
      - "modulex-admin/sql/customer-*.sql"
      - "modulex-store/scripts/store-portal-contract.mjs"
      - "modulex-store/scripts/portal-experience-contract.mjs"
      - "modulex-store/supabase/migrations/*order*.sql"
      - "modulex-store/supabase/migrations/*fulfillment*.sql"
      - "modulex-store/supabase/migrations/*customer*document*.sql"
      - ".github/workflows/admin-a1-core-operations.yml"
  pull_request:
    paths:
      - "modulex-admin/src/app/(admin)/customers/**/orders/**"
      - "modulex-admin/src/components/customers/CustomerOrder*.tsx"
      - "modulex-admin/src/components/customers/CustomerInvoice*.tsx"
      - "modulex-admin/src/components/customers/CustomerShipmentDetailRBAC.tsx"
      - "modulex-admin/src/components/customers/CustomerInstallationDetail.tsx"
      - "modulex-admin/src/lib/customers/order-domain.ts"
      - "modulex-admin/src/lib/customers/project-domain.ts"
      - "modulex-admin/src/lib/auth/permissions.ts"
      - "modulex-admin/scripts/a1-*.mjs"
      - "modulex-admin/scripts/order-*.mjs"
      - "modulex-admin/scripts/val3-*.mjs"
      - "modulex-admin/scripts/dealer-portal-admin-contract.mjs"
      - "modulex-admin/scripts/store-portal-admin-contract.mjs"
      - "modulex-admin/sql/a1-*.sql"
      - "modulex-admin/sql/customer-*.sql"
      - "modulex-store/scripts/store-portal-contract.mjs"
      - "modulex-store/scripts/portal-experience-contract.mjs"
      - "modulex-store/supabase/migrations/*order*.sql"
      - "modulex-store/supabase/migrations/*fulfillment*.sql"
      - "modulex-store/supabase/migrations/*customer*document*.sql"
      - ".github/workflows/admin-a1-core-operations.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  admin-a1-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - run: npm ci
      - run: npm run smoke:a1-core-operations
      - run: node scripts/val3-customers-orders-invoices-contract.mjs
      - run: npm run smoke:order-domain
      - run: npm run smoke:order-lifecycle
      - run: node scripts/order-status-action-guidance-contract.mjs
      - run: npm run smoke:dealer-portal-admin
      - run: npm run smoke:store-portal-admin

  store-portal-boundary-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modulex-store/package-lock.json
      - run: npm ci
      - run: npm run smoke:store-portal
      - run: npm run smoke:portal-experience
