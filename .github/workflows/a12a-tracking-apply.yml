name: A1.2A tracking apply

on:
  push:
    branches:
      - phase-a1/order-list-consistency

permissions:
  contents: write

jobs:
  apply-tracking:
    if: ${{ !contains(github.event.head_commit.message, '[skip a12a-tracking]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply tracking update
        working-directory: modulex-admin
        run: node scripts/apply-a12a-tracking.mjs
      - name: Commit changes
        run: |
          if git diff --quiet -- modulex-admin/ADMIN_ROADMAP.md modulex-admin/src/components/customers/CustomerOrdersList.tsx; then
            exit 0
          fi
          git config user.name "devaeterne"
          git config user.email "info@safaksariyildiz.com"
          git add modulex-admin/ADMIN_ROADMAP.md modulex-admin/src/components/customers/CustomerOrdersList.tsx
          git commit -m "chore(admin): track A1.2A implementation [skip a12a-tracking]"
          git push
