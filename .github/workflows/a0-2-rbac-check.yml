name: A0.2 roadmap closeout

on:
  push:
    branches:
      - phase-a0/admin-rbac-truth
    paths:
      - .github/workflows/a0-2-rbac-check.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-a0/admin-rbac-truth
          fetch-depth: 0
      - name: Update roadmap and remove temporary verification files
        run: |
          python scripts/tmp-a0-2-closeout.py
          git diff --check
          rm .github/workflows/a0-2-rbac-check.yml
          rm scripts/tmp-a0-2-closeout.py
      - name: Commit closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulex-admin/ADMIN_ROADMAP.md .github/workflows/a0-2-rbac-check.yml scripts/tmp-a0-2-closeout.py
          git commit -m "docs: close Admin A0.2 RBAC truth [skip ci]"
          git push origin HEAD:phase-a0/admin-rbac-truth
