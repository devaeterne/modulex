name: Roadmap A0.2 sync

on:
  push:
    branches:
      - docs/a0-2-roadmap-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconcile roadmap files
        run: python .github/scripts/roadmap-a0-2-sync.py

      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          rm .github/workflows/roadmap-a0-2-sync.yml
          rm .github/scripts/roadmap-a0-2-sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulex-admin/ADMIN_ROADMAP.md modulex-store/STORE_ROADMAP.md .github/workflows/roadmap-a0-2-sync.yml .github/scripts/roadmap-a0-2-sync.py
          git commit -m "docs: start Admin A0.2 roadmap package [skip ci]"
          git push origin HEAD:docs/a0-2-roadmap-sync
