name: GC-6 Roadmap Sync

on:
  push:
    branches:
      - feat/gc6-cabinet-journey
    paths:
      - ".github/workflows/gc6-roadmap-sync.yml"

permissions:
  contents: write

jobs:
  sync-roadmaps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gc6-cabinet-journey
      - name: Synchronize roadmap state
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          baseline = "e0ccbcc239a52ac734ede69ed80fcf205bc2a93d"

          store_path = Path("modulex-store/STORE_ROADMAP.md")
          store = store_path.read_text()
          store = re.sub(r"Last reviewed: .*", "Last reviewed: 2026-08-30", store, count=1)
          store = re.sub(r"Main baseline: `[^`]+`", f"Main baseline: `{baseline}`", store, count=1)
          store_status = "Current Granite migration status: **GC-5 Gallery/media migration is production-accepted: 20 projects imported, 13 curated projects published, and 7 non-cabinet-focused Residential source groups intentionally retained as non-publishable drafts. GC-6 Cabinet Journey is in progress: typed process/FAQ CMS, Admin management, production data publication, public RPC gating, lint and production builds are verified; live Store acceptance remains pending PR merge/deploy.**"
          if "Current Granite migration status:" in store:
              store = re.sub(r"Current Granite migration status:.*", store_status, store, count=1)
          else:
              store = store.replace("Current phase: **Phase 2.1 — Public Content & CMS Expansion**\n", "Current phase: **Phase 2.1 — Public Content & CMS Expansion**\n" + store_status + "\n")
          store = store.replace("- [~] Convert Gallery/Projects page to CMS-backed data.", "- [x] Convert Gallery/Projects page to CMS-backed data.")
          store = store.replace(
              "  - Completion remains pending production acceptance with a published Gallery page and at least one approved published project.\n  - Granite GC-5 may supply the curated real project/media content required to close this blocker, but only after its draft/review/publish/live acceptance gate.",
              "  - Production acceptance is complete: Gallery is CMS-backed with 13 curated published projects and 83 controlled project media assets; 7 source groups remain draft by deliberate cabinetry-relevance review rather than migration failure."
          )
          gc6_block = """### Granite GC-6 — Cabinet Journey / FAQ extension\n\n- [~] Publish a CMS-backed cabinet planning/customer-journey surface.\n  - Typed `store_process_steps` and `store_faq_entries` domains, Admin `Cabinet Content` management, published-only public RPCs, CMS page SEO/CTA, conditional sitemap readiness and FAQ structured data are implemented on the GC-6 branch.\n  - Production migration is applied; 4 adapted process steps and 6 original Oakwell cabinetry FAQs are published in controlled data. Anonymous direct table reads remain denied and provenance is omitted from public projections.\n  - Source promotions, fixed SLAs, installation promises, guarantees and other unconfirmed Granite claims were deliberately not migrated.\n  - Branch verification: GC-6 contract, company/gallery/showroom regressions, changed-file lint and Store/Admin production builds pass.\n  - Completion remains `[~]` until the PR is merged/deployed and `/cabinet-process` receives live acceptance.\n\n"""
          if "### Granite GC-6 — Cabinet Journey / FAQ extension" not in store:
              store = store.replace("## 2.1.2 Shared Store chrome", gc6_block + "## 2.1.2 Shared Store chrome")
          store_path.write_text(store)

          admin_path = Path("modulex-admin/ADMIN_ROADMAP.md")
          admin = admin_path.read_text()
          admin = re.sub(r"Last reviewed: .*", "Last reviewed: 2026-08-30", admin, count=1)
          admin = re.sub(r"Main baseline: `[^`]+`", f"Main baseline: `{baseline}`", admin, count=1)
          admin_cross = "Current cross-roadmap package: **Granite GC-5 Gallery/media migration is production-accepted. GC-6 Cabinet Journey is in progress: Admin now has a store.manage-gated Cabinet Content editor for process steps and cabinetry FAQ with explicit draft/publish/unpublish controls; production data and CI are verified, while live acceptance remains pending PR merge/deploy. Admin primary Phase A1 work remains independently owned by its current roadmap next action.**"
          admin = re.sub(r"Current cross-roadmap package:.*", admin_cross, admin, count=1)
          admin_block = """## GC-6 Cabinet Content cross-roadmap status\n\n- [~] Add Admin-managed Cabinet Planning process and FAQ content.\n  - `/store/cabinet-content` manages typed process/FAQ records under `store.manage` with explicit draft/publish/unpublish/delete behavior and source attribution metadata.\n  - `cabinet-process` page-level copy, CTA and SEO remain managed through the existing Store Pages editor rather than a parallel page system.\n  - Production schema/data and Admin scoped lint + production build are verified.\n  - Live Admin/Store acceptance remains pending PR merge/deploy; do not mark complete before that gate.\n\n"""
          if "## GC-6 Cabinet Content cross-roadmap status" not in admin:
              admin = admin.replace("## Mandatory Session & Change Tracking Protocol", admin_block + "## Mandatory Session & Change Tracking Protocol")
          admin_path.write_text(admin)

          migration_path = Path("modulex-store/docs/OAKWELL_GRANITE_CENTER_MIGRATION_ROADMAP.md")
          migration = migration_path.read_text()
          migration = re.sub(r"Last reviewed: .*", "Last reviewed: 2026-08-30", migration, count=1)
          for old, new in [
              ("- `[ ]` import approved cabinet-relevant candidates as drafts;", "- `[x]` import approved cabinet-relevant candidates as drafts;"),
              ("- `[ ]` attach controlled media assets;", "- `[x]` attach controlled media assets;"),
              ("- `[ ]` review and publish curated set;", "- `[x]` review and publish curated set;"),
              ("- `[ ]` verify Gallery readiness/nav/sitemap/live rendering.", "- `[x]` verify Gallery readiness/nav/sitemap/live rendering."),
              ("- `[ ]` adapt process as typed CMS content;", "- `[~]` adapt process as typed CMS content;"),
              ("- `[ ]` create Oakwell cabinetry FAQ in managed data;", "- `[~]` create Oakwell cabinetry FAQ in managed data;"),
          ]:
              migration = migration.replace(old, new)
          gc5_note = """\n**GC-5 production closeout — 2026-08-30:** 20 source project groups and 83 project images are imported into controlled Oakwell CMS/Storage. 13 curated projects are published (4 Residential + 9 Commercial). The remaining 7 Residential groups / 45 linked assets are intentionally retained as draft/mixed with explicit review notes because they are primarily countertop, fireplace, outdoor, shower or material-focused rather than cabinet-project focused.\n"""
          if "**GC-5 production closeout — 2026-08-30:**" not in migration:
              migration = migration.replace("## GC-6 — Cabinet content / customer journey", gc5_note + "\n## GC-6 — Cabinet content / customer journey")
          gc6_note = """\n**GC-6 implementation status — 2026-08-30:** typed process and FAQ domains are migrated to production; 4 source-adapted cabinet-planning steps and 6 original Oakwell cabinetry FAQs are published in controlled data. Draft gating was verified at 0/0 public rows before publication; after publication the narrow RPCs return 4/6 while anon direct table selects remain denied and source provenance remains private. Store/Admin CI is green. Final GC-6 completion remains pending PR merge/deploy and live `/cabinet-process` acceptance.\n"""
          if "**GC-6 implementation status — 2026-08-30:**" not in migration:
              marker = "- `[~]` create Oakwell cabinetry FAQ in managed data;"
              migration = migration.replace(marker, marker + gc6_note)
          migration_path.write_text(migration)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulex-store/STORE_ROADMAP.md modulex-admin/ADMIN_ROADMAP.md modulex-store/docs/OAKWELL_GRANITE_CENTER_MIGRATION_ROADMAP.md
          if git diff --cached --quiet; then
            echo "Roadmaps already synchronized"
          else
            git commit -m "docs: synchronize GC-5 closeout and GC-6 status"
            git push origin HEAD:feat/gc6-cabinet-journey
          fi
