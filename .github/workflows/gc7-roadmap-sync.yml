name: GC-7 Roadmap Sync

on:
  push:
    branches:
      - feat/gc7-attributed-social-proof
    paths:
      - ".github/workflows/gc7-roadmap-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gc7-attributed-social-proof
      - name: Update roadmaps
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          baseline = "edbea195973591cfe64f095a98011a9b6efe3091"

          store_path = Path("modulex-store/STORE_ROADMAP.md")
          store = store_path.read_text()
          store = re.sub(r"Main baseline: `[^`]+`", f"Main baseline: `{baseline}`", store, count=1)
          store_status = "Current Granite migration status: **GC-5 Gallery and GC-6 Cabinet Journey are production-accepted. GC-6 live acceptance verified `/cabinet-process` HTTP 200 with 4 process steps, 6 FAQs, consultation CTA, FAQ structured data and sitemap inclusion. GC-7 Reviews / Social Proof is in progress: typed attributed testimonial CMS, Admin management, two source-linked parent-company excerpts in production, public attribution gating, RBAC, lint and Store/Admin production builds are verified; live homepage acceptance remains pending PR merge/deploy.**"
          store = re.sub(r"Current Granite migration status:.*", store_status, store, count=1)
          gc7_store = """### Granite GC-7 — Reviews / Social Proof\n\n- [~] Publish source-identified social proof without converting parent-company reviews into Oakwell reviews.\n  - Typed `store_testimonials` CMS + narrow published-only public RPC are implemented; anon direct table reads remain denied.\n  - Admin `/store/reviews` is protected by `store.manage` and supports draft/publish/unpublish/delete.\n  - Two short source-linked Granite & Cabinet Center excerpts are published in production data with required source entity, HTTPS source link and visible attribution; no rating is inferred.\n  - Store homepage renders the section only when published rows exist and explicitly labels the content `Granite & Cabinet Center customer reviews` and `not Oakwell-specific reviews`.\n  - GC-7 contract, GC-6/GC-5/company regressions, Admin RBAC, scoped lint and Store/Admin production builds pass.\n  - Completion remains `[~]` until PR merge/deploy and live homepage acceptance.\n\n"""
          if "### Granite GC-7 — Reviews / Social Proof" not in store:
              marker = "## 2.1.2 Shared Store chrome"
              if marker in store:
                  store = store.replace(marker, gc7_store + marker, 1)
              else:
                  store += "\n" + gc7_store
          store_path.write_text(store)

          admin_path = Path("modulex-admin/ADMIN_ROADMAP.md")
          admin = admin_path.read_text()
          admin = re.sub(r"Main baseline: `[^`]+`", f"Main baseline: `{baseline}`", admin, count=1)
          cross = "Current cross-roadmap package: **Granite GC-5 Gallery and GC-6 Cabinet Journey are production-accepted. GC-7 Reviews / Social Proof is in progress: Admin now has a `store.manage`-gated Reviews & Social Proof editor with explicit draft/publish/unpublish/delete controls and mandatory parent attribution fields; production schema/data and Store/Admin CI are verified, while live homepage acceptance remains pending PR merge/deploy. Admin primary Phase A1 work remains independently owned by its current roadmap next action.**"
          admin = re.sub(r"Current cross-roadmap package:.*", cross, admin, count=1)
          admin = admin.replace("- [~] Add Admin-managed Cabinet Planning process and FAQ content.", "- [x] Add Admin-managed Cabinet Planning process and FAQ content.")
          admin = admin.replace("  - Live Admin/Store acceptance remains pending PR merge/deploy; do not mark complete before that gate.", "  - Live `/cabinet-process` acceptance is complete: HTTP 200, 4 process steps, 6 FAQs, CTA, FAQ structured data and sitemap inclusion verified on production.")
          gc7_admin = """## GC-7 Reviews & Social Proof cross-roadmap status\n\n- [~] Add Admin-managed, source-attributed Store review excerpts.\n  - `/store/reviews` is protected by `store.manage` in both sidebar and direct-route RBAC.\n  - Parent-attributed records require source entity, HTTPS source URL and visible attribution before they can be valid public content.\n  - Production contains two curated source-linked Granite & Cabinet Center excerpts; no third-party widget or inferred rating is used.\n  - Admin RBAC, scoped lint and production build are verified.\n  - Live Store homepage acceptance remains pending PR merge/deploy.\n\n"""
          if "## GC-7 Reviews & Social Proof cross-roadmap status" not in admin:
              admin = admin.replace("## Mandatory Session & Change Tracking Protocol", gc7_admin + "## Mandatory Session & Change Tracking Protocol", 1)
          admin_path.write_text(admin)

          migration_path = Path("modulex-store/docs/OAKWELL_GRANITE_CENTER_MIGRATION_ROADMAP.md")
          migration = migration_path.read_text()
          migration = migration.replace("- `[~]` adapt process as typed CMS content;", "- `[x]` adapt process as typed CMS content;")
          migration = migration.replace("- `[~]` create Oakwell cabinetry FAQ in managed data;", "- `[x]` create Oakwell cabinetry FAQ in managed data;")
          old_gc6 = re.compile(r"\*\*GC-6 implementation status — 2026-08-30:\*\*.*")
          new_gc6 = "**GC-6 production closeout — 2026-08-30:** production live acceptance is complete. `/cabinet-process` returns HTTP 200 with 4 source-adapted cabinet-planning steps, 6 original Oakwell cabinetry FAQs, `Start a Project Consultation` → `/contact`, FAQPage structured data and sitemap inclusion. Anonymous direct reads remain denied and provenance stays outside the public projection. Source discounts, SLAs, guarantees and installation promises remain omitted."
          migration = old_gc6.sub(new_gc6, migration, count=1)
          migration = migration.replace("- `[ ]` implement/manage review/testimonial domain;", "- `[~]` implement/manage review/testimonial domain;")
          migration = migration.replace("- `[ ]` import only approved source-linked excerpts/data;", "- `[x]` import only approved source-linked excerpts/data;")
          migration = migration.replace("- `[ ]` enforce parent attribution;", "- `[x]` enforce parent attribution;")
          migration = migration.replace("- `[ ]` avoid third-party broken widgets;", "- `[x]` avoid third-party broken widgets;")
          migration = migration.replace("- `[ ]` verify a parent review cannot render as Oakwell-specific by mistake.", "- `[~]` verify a parent review cannot render as Oakwell-specific by mistake.")
          gc7_note = """\n**GC-7 implementation status — 2026-08-30:** `store_testimonials` is migrated to production with Admin-only CRUD/RLS and a narrow published-only RPC. Draft-gate verification returned 2 draft / 0 public; after controlled publication the RPC returns 2 parent-attributed records, both with Granite & Cabinet Center source identity, HTTPS source URL and visible attribution while anon direct table select remains denied. The homepage code explicitly labels these as `Granite & Cabinet Center customer reviews` and `not Oakwell-specific reviews`; no rating or third-party widget is inferred. Store/Admin CI is green. Final GC-7 completion remains pending PR merge/deploy and live homepage acceptance.\n"""
          if "**GC-7 implementation status — 2026-08-30:**" not in migration:
              marker = "**Exit gate:** every visible review has valid identity/source/attribution and can be managed from Admin."
              migration = migration.replace(marker, gc7_note + "\n" + marker, 1)
          migration_path.write_text(migration)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulex-store/STORE_ROADMAP.md modulex-admin/ADMIN_ROADMAP.md modulex-store/docs/OAKWELL_GRANITE_CENTER_MIGRATION_ROADMAP.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: close GC-6 and record GC-7 implementation status"
            git push origin HEAD:feat/gc7-attributed-social-proof
          fi
