name: Temporary Scan TailAdmin Transform

on:
  push:
    branches:
      - feat/scan-tailadmin-standardization
    paths:
      - ".github/workflows/tmp-scan-tailadmin-transform.yml"

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scan-tailadmin-standardization
      - name: Apply render-only scan transform
        run: python modulex-admin/scripts/tmp-scan-tailadmin-transform.py
      - name: Commit transformed scan components
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulex-admin/src/components/scan/ScanPanel.tsx modulex-admin/src/components/scan/CameraScanner.tsx modulex-admin/src/components/scan/GuidedStockOperation.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(scan): standardize scan workspace UI"
          git push origin HEAD:feat/scan-tailadmin-standardization
