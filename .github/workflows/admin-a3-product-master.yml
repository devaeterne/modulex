name: Admin A3.1 Product Master

on:
  push:
    paths:
      - "modulex-admin/src/app/(admin)/products/**"
      - "modulex-admin/src/app/(admin)/brands/**"
      - "modulex-admin/src/app/(admin)/categories/**"
      - "modulex-admin/src/app/(admin)/pricing/**"
      - "modulex-admin/src/components/products/**"
      - "modulex-admin/src/components/brands/**"
      - "modulex-admin/src/components/categories/**"
      - "modulex-admin/src/components/pricing/**"
      - "modulex-admin/src/components/form/MultiSelect.tsx"
      - "modulex-admin/src/components/form/Select.tsx"
      - "modulex-admin/src/icons/index.tsx"
      - "modulex-admin/sql/a3-product-master-data.sql"
      - "modulex-admin/scripts/a3-product-master-contract.mjs"
      - "modulex-admin/scripts/product-master-v2-contract.mjs"
      - "modulex-admin/scripts/product-ui-smoke-contract.mjs"
      - "modulex-admin/scripts/product-list-ui-contract.mjs"
      - "modulex-admin/scripts/product-form-ui-contract.mjs"
      - "modulex-admin/scripts/product-reference-ui-contract.mjs"
      - "modulex-admin/scripts/taxonomy-ui-contract.mjs"
      - "modulex-admin/scripts/products-pricing-ui-contract.mjs"
      - "modulex-admin/scripts/pricing-product-type-contract.mjs"
      - "modulex-admin/scripts/val-2-products-pricing-validation-contract.mjs"
      - "modulex-admin/docs/acceptance/a3-1-product-master-data.md"
      - "modulex-admin/docs/superpowers/specs/2026-08-30-a3-1-product-master-data-design.md"
      - "modulex-admin/docs/superpowers/plans/2026-08-30-a3-1-product-master-data.md"
      - "modulex-store/supabase/migrations/20260830120000_a3_1_canonical_product_taxonomy.sql"
      - "modulex-store/supabase/migrations/*product_master_v2*.sql"
      - "modulex-store/supabase/migrations/*pricing_product_type*.sql"
      - ".github/workflows/admin-a3-product-master.yml"
  pull_request:
    paths:
      - "modulex-admin/src/app/(admin)/products/**"
      - "modulex-admin/src/app/(admin)/brands/**"
      - "modulex-admin/src/app/(admin)/categories/**"
      - "modulex-admin/src/app/(admin)/pricing/**"
      - "modulex-admin/src/components/products/**"
      - "modulex-admin/src/components/brands/**"
      - "modulex-admin/src/components/categories/**"
      - "modulex-admin/src/components/pricing/**"
      - "modulex-admin/src/components/form/MultiSelect.tsx"
      - "modulex-admin/src/components/form/Select.tsx"
      - "modulex-admin/src/icons/index.tsx"
      - "modulex-admin/sql/a3-product-master-data.sql"
      - "modulex-admin/scripts/a3-product-master-contract.mjs"
      - "modulex-admin/scripts/product-master-v2-contract.mjs"
      - "modulex-admin/scripts/product-ui-smoke-contract.mjs"
      - "modulex-admin/scripts/product-list-ui-contract.mjs"
      - "modulex-admin/scripts/product-form-ui-contract.mjs"
      - "modulex-admin/scripts/product-reference-ui-contract.mjs"
      - "modulex-admin/scripts/taxonomy-ui-contract.mjs"
      - "modulex-admin/scripts/products-pricing-ui-contract.mjs"
      - "modulex-admin/scripts/pricing-product-type-contract.mjs"
      - "modulex-admin/scripts/val-2-products-pricing-validation-contract.mjs"
      - "modulex-admin/docs/acceptance/a3-1-product-master-data.md"
      - "modulex-admin/docs/superpowers/specs/2026-08-30-a3-1-product-master-data-design.md"
      - "modulex-admin/docs/superpowers/plans/2026-08-30-a3-1-product-master-data.md"
      - "modulex-store/supabase/migrations/20260830120000_a3_1_canonical_product_taxonomy.sql"
      - "modulex-store/supabase/migrations/*product_master_v2*.sql"
      - "modulex-store/supabase/migrations/*pricing_product_type*.sql"
      - ".github/workflows/admin-a3-product-master.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  product-master-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - run: npm ci
      - run: npm run smoke:a3-product-master
      - run: npm run smoke:product-master-v2
      - run: node scripts/product-ui-smoke-contract.mjs
      - run: node scripts/product-list-ui-contract.mjs
      - run: node scripts/product-form-ui-contract.mjs
      - run: node scripts/product-reference-ui-contract.mjs
      - run: node scripts/taxonomy-ui-contract.mjs
      - run: node scripts/products-pricing-ui-contract.mjs
      - run: node scripts/pricing-product-type-contract.mjs
      - run: npm run smoke:val-2-products-pricing
