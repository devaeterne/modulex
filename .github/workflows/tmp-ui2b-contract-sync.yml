name: Temporary UI-2B Contract Sync

on:
  push:
    paths:
      - "modulex-admin/scripts/tmp-ui2b-contract-sync.py"

permissions:
  contents: write

jobs:
  sync-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-ui-data-table-system
      - run: python modulex-admin/scripts/tmp-ui2b-contract-sync.py
      - run: git diff --check
      - name: Commit synchronized contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulex-admin/scripts/low-stock-ui-contract.mjs \
                  modulex-admin/scripts/inventory-warehouse-qr-ui-contract.mjs
          git diff --cached --quiet || git commit -m "test(admin): align domain table contracts with UI-2B"
          git push origin HEAD:fix/admin-ui-data-table-system
