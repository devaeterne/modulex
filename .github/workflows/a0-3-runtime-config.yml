name: A0.3 Runtime Config

on:
  push:
    branches:
      - phase-a0/admin-runtime-config-cleanup

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize package-lock identity
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(admin): sync package lock identity"
            git push
          fi
      - name: Run runtime config contract
        run: node scripts/runtime-config-contract.mjs
