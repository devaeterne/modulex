name: A0.3 Runtime Config

on:
  push:
    branches:
      - phase-a0/admin-runtime-config-cleanup

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://bzjoeernnmvuhzyvbowc.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_if_qoUqt9Zb0cBBYew5V2w_Jt2do0V5
      NEXT_PUBLIC_SITE_URL: https://modulex-admin.example.test
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run runtime config contract
        run: npm run smoke:runtime-config
      - name: Run production surface contract
        run: npm run smoke:production-surface
      - name: Run RBAC contract
        run: npm run smoke:rbac
      - name: Run secondary CMS Admin contract
        run: npm run smoke:secondary-cms-admin
      - name: Run dealer onboarding contract
        run: npm run smoke:dealer-onboarding
      - name: Run dealer portal Admin contract
        run: npm run smoke:dealer-portal-admin
      - name: Run Store portal Admin contract
        run: npm run smoke:store-portal-admin
      - name: Run auth recovery contract
        run: npm run smoke:auth-recovery
      - name: Run polling contract
        run: npm run smoke:polling
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check 7b19a5cf417092c6088aff91747e4c1da7c0019f...HEAD -- .
      - name: Record verified A0.3 closeout
        run: |
          python3 scripts/a0-3-runtime-config-closeout.py "${{ github.run_id }}"
          if ! git diff --quiet -- ADMIN_ROADMAP.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ADMIN_ROADMAP.md
            git commit -m "docs(admin): close A0.3 runtime config cleanup"
            git push
          fi
