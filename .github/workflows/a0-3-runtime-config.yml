name: A0.3 Runtime Config

on:
  push:
    branches:
      - phase-a0/admin-runtime-config-cleanup

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize package-lock identity without dependency churn
        run: |
          git show origin/main:modulex-admin/package-lock.json > package-lock.json
          python3 - <<'PY'
          from pathlib import Path
          path = Path("package-lock.json")
          text = path.read_text()
          old = '"name": "free-nextjs-admin-dashboard"'
          new = '"name": "modulex-admin"'
          if text.count(old) != 2:
              raise SystemExit(f"expected exactly two legacy package names, found {text.count(old)}")
          path.write_text(text.replace(old, new, 2))
          PY
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(admin): minimize package lock identity diff"
            git push
          fi
      - name: Run runtime config contract
        run: node scripts/runtime-config-contract.mjs
