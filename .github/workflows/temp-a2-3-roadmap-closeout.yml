name: Temporary A2.3 Roadmap Closeout

on:
  push:
    branches:
      - feat/a2-3-stock-operations-scanning
    paths:
      - .github/workflows/temp-a2-3-roadmap-closeout.yml

permissions:
  contents: write

jobs:
  update-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/a2-3-stock-operations-scanning
      - name: Update roadmap
        run: python modulex-admin/scripts/temp-update-a2-3-roadmap.py
      - name: Commit roadmap closeout
        run: |
          git config user.name "devaeterne"
          git config user.email "info@safaksariyildiz.com"
          git add modulex-admin/ADMIN_ROADMAP.md
          git diff --cached --check
          git commit -m "docs(admin): close A2.3 roadmap acceptance"
          git push origin HEAD:feat/a2-3-stock-operations-scanning
