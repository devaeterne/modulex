name: Temporary UI-2B Table Transform

on:
  push:
    paths:
      - "modulex-admin/scripts/tmp-ui2b-transform.py"

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-ui-data-table-system
      - run: python modulex-admin/scripts/tmp-ui2b-transform.py
      - run: git diff --check
      - name: Commit transformed table surfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulex-admin/src/components/inventory/InventoryTable.tsx \
                  modulex-admin/src/components/inventory/LowStockManager.tsx \
                  modulex-admin/src/components/warehouses/WarehousesTable.tsx \
                  modulex-admin/src/components/zones/ZonesTable.tsx
          git diff --cached --quiet || git commit -m "feat(admin): standardize representative table layouts"
          git push origin HEAD:fix/admin-ui-data-table-system
