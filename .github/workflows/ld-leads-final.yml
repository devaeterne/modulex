name: LD Leads Final Workstream

on:
  push:
    branches:
      - feat/ld-leads-final-20260910
  pull_request:
    paths:
      - 'modulex-admin/src/components/store/StoreLead*.tsx'
      - 'modulex-admin/src/lib/store/leads.ts'
      - 'modulex-admin/scripts/ld-leads-workstream-contract.mjs'
      - 'modulex-admin/ADMIN_ROADMAP.md'
      - 'modulex-store/src/**/leads/**'
      - 'modulex-store/supabase/migrations/*lead*'
      - 'modulex-store/supabase/migrations/*consultation*'
      - '.github/workflows/ld-leads-final.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: LD contract
        run: node modulex-admin/scripts/ld-leads-workstream-contract.mjs

  admin-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
        run: npm run build

  store-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modulex-store/package-lock.json
      - run: npm ci
      - run: npm run smoke:gc4-contact-project-consultation
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
