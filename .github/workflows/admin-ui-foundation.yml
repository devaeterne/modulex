name: Admin UI Foundation

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/CI_WORKFLOW_ARCHITECTURE.md"
      - "modulex-admin/AdminUICheck.md"
      - "modulex-admin/docs/ADMIN_UI_GUIDE.md"
      - "modulex-admin/**"
      - "modulex-store/supabase/migrations/*countertop*.sql"
      - "modulex-store/supabase/migrations/*manual_service*.sql"
      - "modulex-store/supabase/migrations/*calendar*.sql"
      - ".github/workflows/**"
  push:
    paths:
      - "AGENTS.md"
      - "docs/CI_WORKFLOW_ARCHITECTURE.md"
      - "modulex-admin/AdminUICheck.md"
      - "modulex-admin/docs/ADMIN_UI_GUIDE.md"
      - "modulex-admin/**"
      - "modulex-store/supabase/migrations/*countertop*.sql"
      - "modulex-store/supabase/migrations/*manual_service*.sql"
      - "modulex-store/supabase/migrations/*calendar*.sql"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  admin-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - run: npm ci
      - name: CI workflow architecture contract
        run: npm run smoke:ci-workflow-architecture
      - name: API timing contract
        run: npm run smoke:api-timing
      - name: Google Calendar integration contract
        run: npm run smoke:google-calendar
      - name: Admin Calendar scheduling core contract
        run: npm run smoke:admin-calendar
      - name: Admin UI strict self-test
        run: npm run smoke:admin-ui-strict:self-test
      - name: Admin UI strict changed-file gate
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: npm run smoke:admin-ui-strict
      - run: npm run smoke:countertop-ui
      - run: npm run smoke:countertop-domain
      - run: node scripts/countertop-material-band-selection-contract.mjs
      - run: npm run smoke:order-countertop-context
      - run: npm run smoke:order-countertop-initiation
      - run: npm run smoke:order-manual-service-line
      - run: node scripts/admin-table-system-contract.mjs
      - run: node scripts/admin-theme-design-contract.mjs
      - run: node scripts/admin-full-route-regression-contract.mjs
      - run: node scripts/admin-resolution-matrix-contract.mjs
      - name: Approvals UI contract
        run: node scripts/approvals-ui-contract.mjs
      - name: Commercial documents contract
        run: node scripts/commercial-document-contract.mjs
      - name: Customers UI contract
        run: node scripts/customers-ui-contract.mjs
      - name: Dashboard shell contract
        run: node scripts/dashboard-shell-ui-contract.mjs
      - name: General settings UI contract
        run: node scripts/general-settings-ui-contract.mjs
      - name: Mobile shell UI contract
        run: node scripts/mobile-shell-ui-contract.mjs
      - name: Personnel UI contract
        run: node scripts/personnel-ui-contract.mjs
      - name: Leave UI contract
        run: node scripts/leave-ui-contract.mjs
      - name: Request Center UI contract
        run: node scripts/request-center-ui-contract.mjs
      - name: Request Center admin contract
        run: npm run smoke:requests-admin
      - name: Users and Store UI contract
        run: node scripts/users-store-ui-contract.mjs
      - name: Admin users contract
        run: npm run smoke:admin-users
      - name: Admin UI regression
        run: npm run smoke:admin-ui
      - name: Production surface regression
        run: npm run smoke:production-surface
      - name: RBAC regression
        run: npm run smoke:rbac
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
        run: npm run build
