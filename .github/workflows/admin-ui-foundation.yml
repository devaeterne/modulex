name: Admin UI Foundation

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "modulex-admin/ADMIN_ROADMAP.md"
      - "modulex-admin/AdminUICheck.md"
      - "modulex-admin/docs/ADMIN_UI_GUIDE.md"
      - "modulex-admin/src/**"
      - "modulex-admin/scripts/admin-ui-contract.mjs"
      - "modulex-admin/scripts/admin-table-system-contract.mjs"
      - "modulex-admin/package.json"
      - ".github/workflows/admin-ui-foundation.yml"
  push:
    paths:
      - "AGENTS.md"
      - "modulex-admin/ADMIN_ROADMAP.md"
      - "modulex-admin/AdminUICheck.md"
      - "modulex-admin/docs/ADMIN_UI_GUIDE.md"
      - "modulex-admin/src/**"
      - "modulex-admin/scripts/admin-ui-contract.mjs"
      - "modulex-admin/scripts/admin-table-system-contract.mjs"
      - "modulex-admin/package.json"
      - ".github/workflows/admin-ui-foundation.yml"

permissions:
  contents: read

jobs:
  admin-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - run: npm ci
      - run: node scripts/admin-table-system-contract.mjs
      - run: npm run smoke:admin-ui
      - run: npm run smoke:production-surface
      - run: npm run smoke:rbac
      - run: npm run typecheck
      - run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
        run: npm run build
