name: Admin UI Foundation

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "modulex-admin/ADMIN_ROADMAP.md"
      - "modulex-admin/AdminUICheck.md"
      - "modulex-admin/docs/ADMIN_UI_GUIDE.md"
      - "modulex-admin/src/**"
      - "modulex-admin/scripts/admin-ui-contract.mjs"
      - "modulex-admin/scripts/admin-ui-strict-contract.mjs"
      - "modulex-admin/scripts/admin-ui-strict-contract.test.mjs"
      - "modulex-admin/scripts/countertop-ui-contract.mjs"
      - "modulex-admin/scripts/countertop-domain-contract.mjs"
      - "modulex-admin/scripts/countertop-material-band-selection-contract.mjs"
      - "modulex-admin/scripts/order-countertop-context-contract.mjs"
      - "modulex-admin/scripts/order-countertop-initiation-contract.mjs"
      - "modulex-admin/scripts/order-manual-service-line-contract.mjs"
      - "modulex-admin/scripts/admin-table-system-contract.mjs"
      - "modulex-admin/scripts/admin-theme-design-contract.mjs"
      - "modulex-admin/scripts/admin-full-route-regression-contract.mjs"
      - "modulex-admin/scripts/admin-resolution-matrix-contract.mjs"
      - "modulex-admin/scripts/api-timing-contract.mjs"
      - "modulex-admin/package.json"
      - "modulex-store/supabase/migrations/*countertop*.sql"
      - "modulex-store/supabase/migrations/*manual_service*.sql"
      - ".github/workflows/admin-ui-foundation.yml"
  push:
    paths:
      - "AGENTS.md"
      - "modulex-admin/ADMIN_ROADMAP.md"
      - "modulex-admin/AdminUICheck.md"
      - "modulex-admin/docs/ADMIN_UI_GUIDE.md"
      - "modulex-admin/src/**"
      - "modulex-admin/scripts/admin-ui-contract.mjs"
      - "modulex-admin/scripts/admin-ui-strict-contract.mjs"
      - "modulex-admin/scripts/admin-ui-strict-contract.test.mjs"
      - "modulex-admin/scripts/countertop-ui-contract.mjs"
      - "modulex-admin/scripts/countertop-domain-contract.mjs"
      - "modulex-admin/scripts/countertop-material-band-selection-contract.mjs"
      - "modulex-admin/scripts/order-countertop-context-contract.mjs"
      - "modulex-admin/scripts/order-countertop-initiation-contract.mjs"
      - "modulex-admin/scripts/order-manual-service-line-contract.mjs"
      - "modulex-admin/scripts/admin-table-system-contract.mjs"
      - "modulex-admin/scripts/admin-theme-design-contract.mjs"
      - "modulex-admin/scripts/admin-full-route-regression-contract.mjs"
      - "modulex-admin/scripts/admin-resolution-matrix-contract.mjs"
      - "modulex-admin/scripts/api-timing-contract.mjs"
      - "modulex-admin/package.json"
      - "modulex-store/supabase/migrations/*countertop*.sql"
      - "modulex-store/supabase/migrations/*manual_service*.sql"
      - ".github/workflows/admin-ui-foundation.yml"

permissions:
  contents: read

jobs:
  admin-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - run: npm ci
      - name: API timing contract
        run: npm run smoke:api-timing
      - name: Admin UI strict self-test
        run: npm run smoke:admin-ui-strict:self-test
      - name: Admin UI strict changed-file gate
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: npm run smoke:admin-ui-strict
      - run: npm run smoke:countertop-ui
      - run: npm run smoke:countertop-domain
      - run: node scripts/countertop-material-band-selection-contract.mjs
      - run: npm run smoke:order-countertop-context
      - run: npm run smoke:order-countertop-initiation
      - run: npm run smoke:order-manual-service-line
      - run: node scripts/admin-table-system-contract.mjs
      - run: node scripts/admin-theme-design-contract.mjs
      - run: node scripts/admin-full-route-regression-contract.mjs
      - run: node scripts/admin-resolution-matrix-contract.mjs
      - run: npm run smoke:admin-ui
      - run: npm run smoke:production-surface
      - run: npm run smoke:rbac
      - run: npm run typecheck
      - run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
        run: npm run build
