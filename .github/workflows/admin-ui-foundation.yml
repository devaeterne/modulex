name: Admin UI Foundation

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/CI_WORKFLOW_ARCHITECTURE.md"
      - "docs/acceptance/us-date-format-audit.json"
      - "scripts/us-date-format-audit.mjs"
      - "modulex-admin/AdminUICheck.md"
      - "modulex-admin/docs/ADMIN_UI_GUIDE.md"
      - "modulex-admin/**"
      - "modulex-store/supabase/migrations/*countertop*.sql"
      - "modulex-store/supabase/migrations/*manual_service*.sql"
      - "modulex-store/supabase/migrations/*calendar*.sql"
      - "modulex-store/supabase/migrations/*customer_contact_address_lifecycle*.sql"
      - ".github/workflows/**"
  push:
    paths:
      - "AGENTS.md"
      - "docs/CI_WORKFLOW_ARCHITECTURE.md"
      - "docs/acceptance/us-date-format-audit.json"
      - "scripts/us-date-format-audit.mjs"
      - "modulex-admin/AdminUICheck.md"
      - "modulex-admin/docs/ADMIN_UI_GUIDE.md"
      - "modulex-admin/**"
      - "modulex-store/supabase/migrations/*countertop*.sql"
      - "modulex-store/supabase/migrations/*manual_service*.sql"
      - "modulex-store/supabase/migrations/*calendar*.sql"
      - "modulex-store/supabase/migrations/*customer_contact_address_lifecycle*.sql"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  admin-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - run: npm ci
      - name: Dry-run fail-closed Admin US date migration
        run: node scripts/us-date-migrate.mjs
      - name: US date audit scanner self-test
        run: node ../scripts/us-date-format-audit.mjs --self-test
      - name: Inventory current date usage
        run: |
          node ../scripts/us-date-format-audit.mjs --write
          cat ../docs/acceptance/us-date-format-audit.json
      - name: Enforce Admin US date presentation migration
        run: node ../scripts/us-date-format-audit.mjs --check --scope admin
      - name: Admin US date format contract
        run: npm run smoke:us-date-format
      - name: Store US date format contract
        run: npm --prefix ../modulex-store run smoke:us-date-format
      - name: Shared Admin DateInput contract
        run: node scripts/admin-date-input-contract.mjs
      - name: CI workflow architecture contract
        run: npm run smoke:ci-workflow-architecture
      - name: LD Leads final workstream contract
        run: node scripts/ld-leads-workstream-contract.mjs
      - name: API timing contract
        run: npm run smoke:api-timing
      - name: Google Calendar integration contract
        run: npm run smoke:google-calendar
      - name: Admin Calendar scheduling core contract
        run: npm run smoke:admin-calendar
      - name: Calendar V3 bidirectional contract
        run: npm run smoke:calendar-v3
      - name: Admin UI strict self-test
        run: npm run smoke:admin-ui-strict:self-test
      - name: Admin UI strict changed-file gate
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -o pipefail
          npm run smoke:admin-ui-strict 2>&1 | tee admin-ui-strict.log
      - name: Collect Admin UI strict source diagnostics
        if: failure()
        run: |
          awk -F: '/^src\// { print $1 }' admin-ui-strict.log | sort -u > admin-ui-strict-files.txt
          tar -czf admin-ui-strict-sources.tgz -T admin-ui-strict-files.txt
      - name: Upload Admin UI strict diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-strict-diagnostics
          path: |
            modulex-admin/admin-ui-strict.log
            modulex-admin/admin-ui-strict-files.txt
            modulex-admin/admin-ui-strict-sources.tgz
      - run: npm run smoke:countertop-ui
      - run: npm run smoke:countertop-domain
      - run: node scripts/countertop-material-band-selection-contract.mjs
      - run: npm run smoke:order-countertop-context
      - run: npm run smoke:order-countertop-initiation
      - run: npm run smoke:order-manual-service-line
      - run: node scripts/admin-table-system-contract.mjs
      - run: node scripts/admin-theme-design-contract.mjs
      - run: node scripts/admin-full-route-regression-contract.mjs
      - run: node scripts/admin-resolution-matrix-contract.mjs
      - name: Approvals UI contract
        run: node scripts/approvals-ui-contract.mjs
      - name: Commercial documents contract
        run: node scripts/commercial-document-contract.mjs
      - name: Customers UI contract
        run: node scripts/customers-ui-contract.mjs
      - name: Customer production acceptance harness contract
        run: node scripts/customer-production-acceptance-contract.mjs
      - name: CUST-7 VAL-3 Customer lifecycle migration contract
        run: npm run smoke:val-3-customers-orders-invoices
      - name: Dashboard shell contract
        run: node scripts/dashboard-shell-ui-contract.mjs
      - name: General settings UI contract
        run: node scripts/general-settings-ui-contract.mjs
      - name: VAL-5 Store Users Settings contract
        run: node scripts/val5-store-users-settings-contract.mjs
      - name: Mobile shell UI contract
        run: node scripts/mobile-shell-ui-contract.mjs
      - name: Personnel UI contract
        run: node scripts/personnel-ui-contract.mjs
      - name: Leave UI contract
        run: node scripts/leave-ui-contract.mjs
      - name: Request Center UI contract
        run: node scripts/request-center-ui-contract.mjs
      - name: Request Center admin contract
        run: npm run smoke:requests-admin
      - name: Users and Store UI contract
        run: node scripts/users-store-ui-contract.mjs
      - name: Admin users contract
        run: npm run smoke:admin-users
      - name: Sales & Production dashboard UI contract
        run: node scripts/sales-production-report-ui-contract.mjs
      - name: Admin UI regression
        run: npm run smoke:admin-ui
      - name: Production surface regression
        run: npm run smoke:production-surface
      - name: RBAC regression
        run: npm run smoke:rbac
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
        run: npm run build
