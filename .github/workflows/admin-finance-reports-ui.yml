name: Admin Finance Reports UI
on:
  push:
    paths: ["modulex-admin/src/app/(admin)/finance/**", "modulex-admin/src/app/(admin)/customers/invoices/**", "modulex-admin/src/app/(admin)/approvals/**", "modulex-admin/src/app/(admin)/pricing/cost-margin/**", "modulex-admin/src/app/(admin)/settings/general/tax-rules/**", "modulex-admin/src/app/(admin)/settings/payment-methods/**", "modulex-admin/src/app/(admin)/reports/**", "modulex-admin/src/components/approvals/**", "modulex-admin/src/components/reports/**", "modulex-admin/scripts/finance-reports-ui-contract.mjs", ".github/workflows/admin-finance-reports-ui.yml"]
  pull_request:
    paths: ["modulex-admin/src/app/(admin)/finance/**", "modulex-admin/src/app/(admin)/customers/invoices/**", "modulex-admin/src/app/(admin)/approvals/**", "modulex-admin/src/app/(admin)/pricing/cost-margin/**", "modulex-admin/src/app/(admin)/settings/general/tax-rules/**", "modulex-admin/src/app/(admin)/settings/payment-methods/**", "modulex-admin/src/app/(admin)/reports/**", "modulex-admin/src/components/approvals/**", "modulex-admin/src/components/reports/**", "modulex-admin/scripts/finance-reports-ui-contract.mjs", ".github/workflows/admin-finance-reports-ui.yml"]
permissions: { contents: read }
jobs:
  finance-reports-verification:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: modulex-admin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: modulex-admin/package-lock.json }
      - run: npm ci
      - run: node scripts/finance-reports-ui-contract.mjs
      - run: npm run smoke:production-surface
      - run: npm run smoke:rbac
      - run: npm run lint
      - name: Build
        env: { NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key }
        run: npm run build
