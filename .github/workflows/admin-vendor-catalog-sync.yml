name: Admin Vendor Catalog Sync

on:
  push:
    paths:
      - "modulex-admin/src/lib/vendor-catalog/**"
      - "modulex-admin/src/app/api/vendor-catalog/**"
      - "modulex-admin/src/app/(admin)/products/vendor-imports/**"
      - "modulex-admin/src/layout/AppSidebar.tsx"
      - "modulex-admin/vercel.json"
      - "modulex-admin/sql/vendor-catalog-sync*.sql"
      - "modulex-admin/sql/stone-vendor-catalog-foundation.sql"
      - "modulex-admin/scripts/vendor-catalog-sync-contract.mjs"
      - "modulex-admin/scripts/stone-vendor-catalog-contract.mjs"
      - "modulex-admin/scripts/stone-media-approval-contract.mjs"
      - "modulex-admin/scripts/stone-product-identity-contract.mjs"
      - "modulex-admin/scripts/msi-pagination-contract.mjs"
      - "modulex-admin/scripts/marble-systems-stale-product-contract.mjs"
      - "modulex-admin/scripts/vendor-approval-idempotency-contract.mjs"
      - "modulex-admin/scripts/vendor-availability-contract.mjs"
      - "modulex-admin/docs/VENDOR_CATALOG_SYNC.md"
      - "modulex-admin/docs/STONE_VENDOR_CATALOG.md"
      - "modulex-store/supabase/migrations/*vendor_catalog_sync*.sql"
      - "modulex-store/supabase/migrations/*vendor_catalog_availability*.sql"
      - "modulex-store/supabase/migrations/*stone_vendor_catalog*.sql"
      - ".github/workflows/admin-vendor-catalog-sync.yml"
  pull_request:
    paths:
      - "modulex-admin/src/lib/vendor-catalog/**"
      - "modulex-admin/src/app/api/vendor-catalog/**"
      - "modulex-admin/src/app/(admin)/products/vendor-imports/**"
      - "modulex-admin/src/layout/AppSidebar.tsx"
      - "modulex-admin/vercel.json"
      - "modulex-admin/sql/vendor-catalog-sync*.sql"
      - "modulex-admin/sql/stone-vendor-catalog-foundation.sql"
      - "modulex-admin/scripts/vendor-catalog-sync-contract.mjs"
      - "modulex-admin/scripts/stone-vendor-catalog-contract.mjs"
      - "modulex-admin/scripts/stone-media-approval-contract.mjs"
      - "modulex-admin/scripts/stone-product-identity-contract.mjs"
      - "modulex-admin/scripts/msi-pagination-contract.mjs"
      - "modulex-admin/scripts/marble-systems-stale-product-contract.mjs"
      - "modulex-admin/scripts/vendor-approval-idempotency-contract.mjs"
      - "modulex-admin/scripts/vendor-availability-contract.mjs"
      - "modulex-admin/docs/VENDOR_CATALOG_SYNC.md"
      - "modulex-admin/docs/STONE_VENDOR_CATALOG.md"
      - "modulex-store/supabase/migrations/*vendor_catalog_sync*.sql"
      - "modulex-store/supabase/migrations/*vendor_catalog_availability*.sql"
      - "modulex-store/supabase/migrations/*stone_vendor_catalog*.sql"
      - ".github/workflows/admin-vendor-catalog-sync.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vendor-catalog-sync-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulex-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modulex-admin/package-lock.json
      - run: npm ci
      - run: node scripts/vendor-catalog-sync-contract.mjs
      - run: node scripts/stone-vendor-catalog-contract.mjs
      - run: node scripts/stone-media-approval-contract.mjs
      - run: node scripts/stone-product-identity-contract.mjs
      - run: node scripts/msi-pagination-contract.mjs
      - run: node scripts/marble-systems-stale-product-contract.mjs
      - run: node scripts/vendor-approval-idempotency-contract.mjs
      - run: node scripts/vendor-availability-contract.mjs
